[synthesizer]
#masterGain = -17.75 # Pirate Audio line out 
masterGain = -7.0 # Pirate Audio headphone amp
#masterGain = -14.75 # Spotpear Game 1.3
chassisGain = 0
engineGain = -2
transmissionGain = 0
transmissionGainMinRace = -3
transmissionGainMinStreet = -6
gainIncrement = 0.25
engineFrequencyMin = 8.0
engineFrequencyMax = 160.0
internalSampleRateHz = 8000
outputSampleRateHz = 32000
# outputFile = "/tmp/simtezilo.wav"

[haptics]
jerkCurve = 190
jerkMax = 80
snapCurve = 580
snapMax = 70
dynamicTransmissionFeedback = true
dynamicTransmissionCurve = 150
dynamicTransmissionGforceMax = 2.0
pulseMaxAmplitude = 1.0
pulseMinFrequencyHz = 8
pulseMaxFrequencyHz = 60

