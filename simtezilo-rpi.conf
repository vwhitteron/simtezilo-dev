[app]
language = "en"
accent = "gb"
# logLevel = "warn"
logLevel = "info"
replayMode = false
# replayMode = true
cacheDir = "/var/cache/simtezilo"

[telemetry]
source = "udp://10.255.1.120:33739" # Simrig
# source = "udp://10.255.1.119:33739" # Lounge
# source = "udp://255.255.255.255:33739"
# source = "file://opt/simtezilo/replays/spa-francorchamps-gr010.gtz"
# source = "file://opt/simtezilo/replays/spa-francorchamps-lexus-lc500.gtz"
# source = "file://opt/simtezilo/replays/trial-mountain-porsche-911-rsr-991-17.gtz"
# source = "file://opt/simtezilo/replays/mt-panorama-nissan-r92cp-89.gtz"
# source = "file://opt/simtezilo/replays/tilde.gtz"

[synthesizer]
#masterGain = -17.75 # Pirate Audio line out 
masterGain = -7.00 # Pirate Audio headphone amp
#masterGain = -14.75 # Spotpear Game 1.3
chassisGain = -0.00
engineGain = -3.50
transmissionGain = -0.00
transmissionGainMinRace = -4.50
transmissionGainMinStreet = -6.00
gainIncrement = 0.25
engineFrequencyMin = 8.0
engineFrequencyMax = 160.0
internalSampleRateHz = 8000
outputSampleRateHz = 32000
# outputFile = "/tmp/simtezilo.wav"

[haptics]
jerkCurve = 190
jerkMax = 80
snapCurve = 580
snapMax = 70
dynamicTransmissionFeedback = true
dynamicTransmissionCurve = 150
dynamicTransmissionGforceMax = 2.0
pulseMaxAmplitude = 1.0
pulseMinFrequencyHz = 8
pulseMaxFrequencyHz = 60

