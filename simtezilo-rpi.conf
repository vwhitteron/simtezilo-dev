jerkMax = 80
snapCurve = 580
snapMax = 70
dynamicTransmissionFeedback = true
dynamicTransmissionCurve = 150
dynamicTransmissionGforceMax = 2.0
pulseMaxAmplitude = 1.0
pulseMinFrequencyHz = 8
pulseMaxFrequencyHz = 60

