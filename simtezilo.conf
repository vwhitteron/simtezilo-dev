[app]
# Language for the user interface.
# Supported languages: en, jp
language = "en"

# Log level (trace, debug, info, warn, error, fatal, panic, off)
# logLevel = "warn"
logLevel = "info"

# Enable haptics during replays
# replayMode = false
replayMode = true

[telemetry]
# Telemetry data source (udp://<ip>:<port>, file://<path>/<file>.<gtr|gtz>)
# source = "udp://10.255.1.119:33739" # Lounge
# source = "udp://10.255.1.120:33739" # Simrig
# source = "udp://255.255.255.255:33739"
source = "file://data/replays/spa-francorchamps-gr010.gtz"
# source = "file://data/replays/spa-francorchamps-lexus-lc500.gtz"
# source = "file://data/replays/trial-mountain-porsche-911-rsr-991-17.gtz"
# source = "file://data/replays/mt-panorama-nissan-r92cp-89.gtz"
# source = "file://data/replays/tilde.gtz"

[synthesizer]
## All gain levels are in dB between 0 and -60, with -60 being silent.

# Final gain level to be applied to all haptic output.
masterGain = -1.50

# Gain level to be applied to the chassis bump and impact haptics.
chassisGain = -60.00

# Gain level to be applied to the engine haptics.
engineGain = -4.25

# Gain level to be applied to the transmission haptics.
transmissionGain = -0.00

# Minimum gain level for race car transmission haptics, ie when stopped and idle.
transmissionGainMinRace = -4.50

# Minimum gain level for tuned car transmission haptics, ie when stopped and idle.
transmissionGainMinTuned = -3.00

# Minimum gain level for street car transmission haptics, ie when stopped and idle.
transmissionGainMinStreet = -6.00

# Gain level increment used when increasing and decreasing settings in the UI.
gainIncrement = 0.25

# Internal audo sample rate used for synthesis. Lower values will result in lower latency.
internalSampleRateHz = 8000

# Audio output sample rate. The hardware will dictate the lowest sample rate that can be used.
# Most audio devices accept 32KHz however some will go as low as 8Khz which is more than sufficient.
# Generally use the lowest sample rate that your hardware supports to reduce latency and CPU usage.
outputSampleRateHz = 32000

# Output the audio signal to to a wav file when defined.
# outputFile = "/tmp/simtezilo.wav"

[haptics]
# The compression curve applied to the jerk value to bring it within haptic range (1-999).
jerkCurve = 190

# The maximum value of the jerk curve (x1000). The jerk curve flattens out after this point.
jerkMax = 80

# The compression curve applied to the snap value to bring it within haptic range (1-999).
snapCurve = 580

# The saturation point of the snap value (x1000). The snap curve flattens out after this point.
snapMax = 70

# Enable g-force relative gear change feedback. When disabled the gear change feedback will
# be fixed at full volume and can be adjusted using the `transmissionGain` setting.
# When enabled the gear change feedback will be stronger at higher longitudinal g-force levels
# to mimic the sensation of acceleration interruption.
dynamicTransmissionFeedback = true

# The compression curve applied gearshift feedback based on the g-force level (1-999)
dynamicTransmissionCurve = 150

# The g-force threshold beyond which maximum gearshift feedback is applied
dynamicTransmissionGforceMax = 2.0

# Maximum output amplitude for haptics. Any value higher than 1 could result in clipping.
pulseMaxAmplitude = 1.0

# Minimum output frequency for haptics.
# Lower minimum values may be too muted to feel and higher values will result
# in a harsher ride.
pulseMinFrequencyHz = 8

# Maximum output frequency for haptics.
# Lower maximum values may not be harsh enough for large impacts and higher
# values may also not be harsh enough either. The value should be lower than
# the rolloff point of the amplifiers low pass filter.
pulseMaxFrequencyHz = 60

