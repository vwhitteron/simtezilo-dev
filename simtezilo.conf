[app]
# Language for the user interface.
# Supported languages: en, jp
language = "en"

# Log level (trace, debug, info, warn, error, fatal, panic, off)
# logLevel = "warn"
logLevel = "info"

# Enable haptics during replays
# replayMode = false
replayMode = true

[telemetry]
# Telemetry data source (udp://<ip>:<port>, file://<path>/<file>.<gtr|gtz>)
# source = "udp://255.255.255.255:33739"
# source = "file://data/replays/spa-francorchamps-gr010.gtz"
# source = "file://data/replays/spa-francorchamps-lexus-lc500.gtz"
# source = "file://data/replays/trial-mountain-porsche-911-rsr-991-17.gtz"
# source = "file://data/replays/mt-panorama-nissan-r92cp-89.gtz"
source = "file://data/replays/tilde.gtz"

[synthesizer]
# Gain level to be applied to audio output.
masterGain = -1.5
gainIncrement = 0.25
chassisVolume = 100
gearShiftVolume = 95
gearShiftVolumeMinRace = 40
gearShiftVolumeMinStreet = 20

# Audio sample rate. Lower values will result in lower latency. The hardware
# may also dictate the lowest sample rate that can be used.
sampleRateHz = 8000

# Output the audio signal to to a wav file when defined.
# outputFile = "/tmp/simtezilo.wav"

# TODO: add description
jerkCurve = 210
jerkMax = 80
snapCurve = 580
snapMax = 70
dynamicGearShiftFeedback = true
dynamicGearShiftCurve = 150
dynamicGearShiftGforceMax = 2.0

algorithm = "sum"

# Maximum output amplitude for haptics. Any value higher than 1 could result in clipping.
pulseMaxAmplitude = 0.98

# Minimum output frequency for haptics.
# Lower minimum values may be too muted to feel and higher values will result
# in a harsher ride.
pulseMinFrequencyHz = 8

# Maximum output frequency for haptics.
# Lower maximum values may not be harsh enough for large impacts and higher
# values may also not be harsh enough either. The value should be lower than
# the rolloff point of the amplifiers low pass filter.
pulseMaxFrequencyHz = 60

# Signal equaliser levels from 10Hz to 40Hz in 1Hz steps.
# eq = [
#     2.00, 2.00, 1.90, 1.80, 1.70, 1.60, 1.50, 1.45, 1.40, 1.35, # 10-19Hz
#     1.30, 1.25, 1.20, 1.15, 1.10, 1.05, 1.00, 1.00, 1.00, 1.00, # 20-29Hz
#     1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, # 30-39Hz
#     1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, # 40-49Hz
# ]

[hardware]
# Raspberry Pi HAT hardware to use for display and buttons.
# Supported hardware:
# pirateaudio: Pimoroni PirateAudio
# spotpear: Spotpear RPi-1.3inch-MINI-LCD
# waveshare: Waveshare 1.3inch LCD HAT
model = "none"

# Display orientation in degrees (0, 90, 180, 270).
displayOrientation = 0