# Example configuration for engine vibration haptics

[synthesizer]
# Master volume control
masterGain = -15.0

# Engine vibration settings
engineGain = -8.0              # Volume of engine vibration (-60 to 0 dB)
engineFrequencyMin = 15.0      # Low-frequency vibration (Hz) at idle RPM
engineFrequencyMax = 45.0      # High-frequency vibration (Hz) at redline RPM
engineAmplitudeScale = 0.3     # Overall strength of engine vibration (0.0-1.0)

# Chassis haptics (existing)
chassisGain = 0.0

# Transmission haptics (existing)
transmissionGain = -2.0
transmissionGainMinRace = -7.0
transmissionGainMinStreet = -10.0
dynamicTransmissionFeedback = true
dynamicTransmissionCurve = 150
dynamicTransmissionGforceMax = 1.0

# Audio synthesis settings
sampleRateHz = 8000
algorithm = "sum"

# Haptic response curves
jerkCurve = 375
jerkMax = 50
snapCurve = 420  
snapMax = 52
pulseMaxAmplitude = 1.0
pulseMaxFrequencyHz = 60.0
pulseMinFrequencyHz = 16.0

[telemetry]
source = "udp://255.255.255.255:33739"

[app]
replayMode = false
logLevel = "info"
language = "en"

[hardware]
model = "none"
displayOrientation = 0
