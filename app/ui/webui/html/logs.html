<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Halfmoon CSS -->
    <link rel="stylesheet" href="/css/halfmoon.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const currentPageId = 'logs';

        // Sample log data for demonstration
        const sampleLogs = [
            { timestamp: '2024-10-16 14:30:15.123', level: 'info', message: 'Application started successfully' },
            { timestamp: '2024-10-16 14:30:16.456', level: 'info', message: 'WebSocket server listening on port 8080' },
            { timestamp: '2024-10-16 14:30:17.789', level: 'debug', message: 'Telemetry data collection initialized' },
            { timestamp: '2024-10-16 14:30:20.321', level: 'info', message: 'Client connected from 192.168.1.100' },
            { timestamp: '2024-10-16 14:30:25.654', level: 'warn', message: 'High CPU usage detected: 85%' },
            { timestamp: '2024-10-16 14:30:30.987', level: 'info', message: 'Telemetry data streaming active' },
            { timestamp: '2024-10-16 14:30:35.234', level: 'debug', message: 'Processing 120 data points per second' },
            { timestamp: '2024-10-16 14:30:40.567', level: 'error', message: 'Failed to connect to simulation: Connection timeout' },
            { timestamp: '2024-10-16 14:30:42.890', level: 'info', message: 'Retrying connection to simulation...' },
            { timestamp: '2024-10-16 14:30:45.123', level: 'info', message: 'Connection to simulation established' }
        ];

        function getLevelBadgeClass(level) {
            const levelMap = {
                'info': 'badge text-bg-info',
                'warn': 'badge text-bg-warning',
                'error': 'badge text-bg-danger',
                'debug': 'badge text-bg-secondary'
            };
            return levelMap[level] || 'badge text-bg-secondary';
        }

        function renderLogs() {
            const logsContainer = document.getElementById('logs-container');
            logsContainer.innerHTML = sampleLogs.map(log => `
                <div class="card p-10" style="margin-bottom: 2px;">
                    <div class="d-flex align-items-center">
                        <div class="font-monospace" style="min-width: 200px; max-width: 200px;">
                            <span class="text-muted">${log.timestamp}</span>
                        </div>
                        <div class="text-center" style="min-width: 80px; max-width: 80px; margin: 0 5px;">
                            <span class="${getLevelBadgeClass(log.level)}">${log.level.toUpperCase()}</span>
                        </div>
                        <div class="flex-fill font-monospace">
                            <span>${log.message}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderLogs();
        });
    </script>
    <script src="/js/i18n.js"></script>
    <script src="/js/navigation.js"></script>
    <title>Logs - Simtezilo</title>
</head>

<body data-bs-theme="dark">
    <div id="navigation"></div>

    <div class="content-container">
        <!-- Statistics Cards -->
        <div class="row mx-auto" style="max-width: 60%; margin-top: 30px; margin-bottom: 30px; gap: 15px;">
            <div class="col-sm ms-20">
                <div class="card d-flex flex-row align-items-center justify-content-between border"
                    style="padding: 15px; border-color: rgba(255,255,255,0.1) !important;">
                    <p class="text-muted mb-0 small">Total Entries</p>
                    <h4 class="mb-0">10</h4>
                </div>
            </div>
            <div class="col-sm">
                <div class="card d-flex flex-row align-items-center justify-content-between border"
                    style="padding: 15px; border-color: rgba(255,255,255,0.1) !important;">
                    <p class="text-muted mb-0 small">Errors</p>
                    <h4 class="mb-0 text-danger">1</h4>
                </div>
            </div>
            <div class="col-sm">
                <div class="card d-flex flex-row align-items-center justify-content-between border"
                    style="padding: 15px; border-color: rgba(255,255,255,0.1) !important;">
                    <p class="text-muted mb-0 small">Warnings</p>
                    <h4 class="mb-0 text-warning">1</h4>
                </div>
            </div>
            <div class="col-sm me-20">
                <div class="card d-flex flex-row align-items-center justify-content-between border"
                    style="padding: 15px; border-color: rgba(255,255,255,0.1) !important;">
                    <p class="text-muted mb-0 small">Info Messages</p>
                    <h4 class="mb-0 text-info">6</h4>
                </div>
            </div>
        </div>

        <!-- Coming Soon Alert -->
        <div class="alert alert-info text-center mx-auto" role="alert"
            style="max-width: 70%; margin-top: 30px; margin-bottom: 30px;">
            <p class="mb-0">Real-time log streaming and advanced filtering features are currently under development.</p>
        </div>

        <!-- Logs Card -->
        <div class="card mt-30">
            <div class="d-flex align-items-center justify-content-end mb-15">
                <div class="d-flex gap-10">
                    <select class="form-select form-select-sm w-auto">
                        <option>All</option>
                        <option>Error</option>
                        <option>Warning</option>
                        <option>Info</option>
                        <option>Debug</option>
                    </select>
                    <button class="btn btn-sm btn-primary" onclick="renderLogs()">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button class="btn btn-sm btn-secondary">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button class="btn btn-sm btn-secondary">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>

            <div id="logs-container" class="mt-15">
                <!-- Logs will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>

</html>
