        // Maps a true lap distance to its plotted x on the speed chart. When the visible
        // section wraps the start/finish line, the trailing (high-distance) part is shifted
        // back by one lap so it sits just before the leading part. Identity when no wrap.
        function speedDisplayX(dist) {
            if (speedWrapThreshold != null && dist >= speedWrapThreshold) return dist - totalDist;
            return dist;
        }

        // Plot speed vs distance for the visible track only. Visible frames form runs of
        // consecutive indices; a run leaving and re-entering the viewport is drawn as
        // separate segments (null break). A section that straddles the start/finish line
        // shows up as a run ending at the last frame plus a run starting at the first — one
        // physical piece — so it is unwrapped and drawn as a single continuous trace.
        function updateSpeedChart(coords, mask) {
            if (!speedChart) return;
            const n = coords.length;

            // Maximal runs of consecutive on-screen frames.
            const runs = [];
            let s = -1;
            for (let i = 0; i < n; i++) {
                const on = !mask || !!mask[i];
                if (on && s < 0) s = i;
                if (!on && s >= 0) { runs.push([s, i - 1]); s = -1; }
            }
            if (s >= 0) runs.push([s, n - 1]);

            // Detect a start/finish straddle: a run touching the first frame and one
            // touching the last frame. The trailing run is unwrapped (shifted -totalDist)
            // and plotted first, ahead of the leading run.
            const wrap = runs.length >= 2 && runs[0][0] === 0 &&
                runs[runs.length - 1][1] === n - 1 && totalDist > 0;
            speedWrapThreshold = wrap ? cumulativeDists[runs[runs.length - 1][0]] : null;
            const order = wrap ? [runs[runs.length - 1], ...runs.slice(0, runs.length - 1)] : runs;

            const pts = [];
            let firstX = null, lastX = null;
            for (let r = 0; r < order.length; r++) {
                const [a, b] = order[r];
                if (r > 0) {
                    // Break the line unless this run is physically adjacent to the previous
                    // one in cyclic frame order (the unwrap join is; a real gap is not).
                    const prevEnd = order[r - 1][1];
                    const adjacent = (prevEnd + 1) % n === a;
                    if (!adjacent) {
                        pts.push({ x: (lastX + speedDisplayX(cumulativeDists[a])) / 2, y: null });
                    }
                }
                for (let i = a; i <= b; i++) {
                    const x = speedDisplayX(cumulativeDists[i] ?? 0);
                    pts.push({ x, y: speeds[i] ?? 0, t: coords[i].throttle ?? 0, b: coords[i].brake ?? 0, frame: i });
                    if (firstX === null) firstX = x;
                    lastX = x;
                }
            }
            // Bind the x-axis to the visible extent so the trace fills the axis and the x zoom
            // tracks the visible range, rather than the chart re-fitting/snapping to the data.
            speedChart.options.scales.x.min = firstX;
            speedChart.options.scales.x.max = lastX;
            speedChart.data.datasets = [{
                data: pts,
                borderColor: '#888',
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.15,
                // Colour each segment by driver input: green on throttle, red on brake.
                segment: {
                    borderColor: (ctx) => {
                        const d = ctx.chart.data.datasets[ctx.datasetIndex].data[ctx.p1DataIndex];
                        return d && d.y != null ? throttleBrakeColor(d.t, d.b) : undefined;
                    },
                },
            }];
            speedChart.update('none');
        }

        // Segment colour from throttle/brake percentages (0-100): green for throttle, red for
        // brake (brighter with more input), neutral grey when coasting.
        function throttleBrakeColor(t, b) {
            t = t || 0; b = b || 0;
            if (t < 3 && b < 3) return '#8a8a8a';
            if (b >= t) {
                const k = Math.min(1, b / 100);
                const c = Math.round(70 * (1 - k));
                return `rgb(${Math.round(150 + 105 * k)}, ${c}, ${c})`;
            }
            const k = Math.min(1, t / 100);
            const c = Math.round(70 * (1 - k));
            return `rgb(${c}, ${Math.round(150 + 105 * k)}, ${c})`;
        }

        // Mirror app/haptics/chassis.go calculateChassisHapticPulseAmplitude and
        // calculateChassisHapticPulseFrequency (and the config's updateJerkScale/
        // updateSnapScale), so the gain/frequency plot tracks the sliders without a
        // server round-trip on every move.
        const GAIN_FLOOR_DB = -60;   // plot floor; the curve runs to -inf as jerk -> 0
        let pulseLimits = { minFrequencyHz: 16, maxFrequencyHz: 60, maxAmplitude: 1 };

        function gainDbOf(jerk) {
            const exponent = tuneValues.jerkCurve / 1000;
            const jerkScale = Math.pow(10, tuneValues.jerkPivotGain / 20) / Math.pow(tuneValues.jerkPivot, exponent);
            const amp = Math.min(Math.pow(Math.abs(jerk), exponent) * jerkScale, pulseLimits.maxAmplitude);
            if (!(amp > 0)) return GAIN_FLOOR_DB;
            const db = 20 * Math.log10(amp);
            return Number.isFinite(db) ? Math.max(GAIN_FLOOR_DB, db) : GAIN_FLOOR_DB;
        }

        function freqHzOf(snap) {
            const exponent = tuneValues.snapCurve / 1000;
            const snapScale = 1 / Math.pow(1000 * tuneValues.snapMax, exponent);
            const scaler = Math.pow(Math.abs(snap), exponent) * snapScale;
            const hz = (pulseLimits.maxFrequencyHz - pulseLimits.minFrequencyHz) * scaler;
            return Number.isFinite(hz)
                ? Math.min(pulseLimits.maxFrequencyHz, Math.max(pulseLimits.minFrequencyHz, hz))
                : pulseLimits.minFrequencyHz;
        }

        // Frames with essentially no jerk pile up in the bottom-left corner of the
        // gain/frequency plot, since both axes clamp: the gain bottoms out at the plot
        // floor and the frequency at the configured minimum. They carry no tuning
        // information and swamp the points that do, so they are left off the plot.
        function audible(pt) {
            return pt.y > GAIN_FLOOR_DB;
        }

        function lerp(a, b, t) { return a + (b - a) * t; }

        function scalesCloseEnough(a, b) {
            return Math.abs(a.xMin - b.xMin) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.xMax - b.xMax) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.yMin - b.yMin) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.yMax - b.yMax) < SCALE_SNAP_THRESHOLD;
        }

        function startScaleChase() {
            if (scaleChaseRaf) return; // already running
            function step() {
                if (!displayedScales || !targetScales) {
                    scaleChaseRaf = null;
                    return;
                }
                if (scalesCloseEnough(displayedScales, targetScales)) {
                    // Arrived — snap to exact target values
                    displayedScales = { ...targetScales };
                    applyScalesToChart(displayedScales);
                    chart.update('none');
                    scaleChaseRaf = null;
                    return;
                }
                displayedScales.xMin = lerp(displayedScales.xMin, targetScales.xMin, SCALE_LERP);
                displayedScales.xMax = lerp(displayedScales.xMax, targetScales.xMax, SCALE_LERP);
                displayedScales.yMin = lerp(displayedScales.yMin, targetScales.yMin, SCALE_LERP);
                displayedScales.yMax = lerp(displayedScales.yMax, targetScales.yMax, SCALE_LERP);

                applyScalesToChart(displayedScales);
                chart.update('none');
                scaleChaseRaf = requestAnimationFrame(step);
            }
            scaleChaseRaf = requestAnimationFrame(step);
        }

        // Apply displayedScales to chart, rounding min/max to niceAxisStep precision to prevent
        // label jitter from floating-point lerp values.
        function applyScalesToChart(scales) {
            const xStep = niceAxisStep(scales.xMax - scales.xMin || 1);
            const yStep = niceAxisStep(scales.yMax - scales.yMin || 1);
            chart.options.scales.x.min = Math.round(scales.xMin / xStep) * xStep;
            chart.options.scales.x.max = Math.round(scales.xMax / xStep) * xStep;
            chart.options.scales.y.min = Math.round(scales.yMin / yStep) * yStep;
            chart.options.scales.y.max = Math.round(scales.yMax / yStep) * yStep;
        }

        // Round to a "nice" number: 1, 2, 5, 10, 20, 50, 100, ...
        function niceStep(range) {
            const rough = Math.pow(10, Math.floor(Math.log10(range)));
            const frac = range / rough;
            if (frac <= 1.5) return rough;
            if (frac <= 3.5) return rough * 2;
            if (frac <= 7.5) return rough * 5;
            return rough * 10;
        }

        // A finer step for axis bounds: targets ~12 tick intervals so min/max
        // hug the data rather than overshoot by a full order of magnitude.
        function niceAxisStep(range) {
            return niceStep(range / 12);
        }

        function niceMinMax(dataMin, dataMax) {
            const range = dataMax - dataMin || 1;
            const step = niceAxisStep(range);
            return {
                min: Math.floor(dataMin / step) * step,
                max: Math.ceil(dataMax / step) * step,
            };
        }

        // Compute nice bounds directly from data points — no Chart.js render needed
        function computeNiceBounds(datasets) {
            let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
            datasets.forEach(ds => {
                ds.data.forEach(pt => {
                    if (pt.x < xMin) xMin = pt.x;
                    if (pt.x > xMax) xMax = pt.x;
                    if (pt.y < yMin) yMin = pt.y;
                    if (pt.y > yMax) yMax = pt.y;
                });
            });
            if (!isFinite(xMin)) { xMin = -1; xMax = 1; yMin = -1; yMax = 1; }
            const xNice = niceMinMax(xMin, xMax);
            const yNice = niceMinMax(yMin, yMax);
            return { xMin: xNice.min, xMax: xNice.max, yMin: yNice.min, yMax: yNice.max };
        }

        // Rebuild the "point of interest" overlay dataset from highlightSource, excluding any
        // surfaces currently hidden via the legend. Given a low `order` so it draws on top
        // (Chart.js paints datasets in reverse order). Each point keeps its surface colour with
        // a white ring. Call after any change to selection or surface visibility.
        function syncHighlight() {
            if (!chart) return;

            chart.data.datasets = chart.data.datasets.filter(ds => ds.label !== HIGHLIGHT_LABEL);

            const hidden = new Set();
            chart.data.datasets.forEach((ds, i) => {
                if (chart.getDatasetMeta(i).hidden) hidden.add(ds.label);
            });

            const pts = highlightSource.filter(p => !hidden.has(p.surface));
            if (pts.length === 0) return;

            chart.data.datasets.push({
                label: HIGHLIGHT_LABEL,
                data: pts,
                backgroundColor: pts.map(p => (surfaceColors[p.surface] || surfaceColors.unknown).border),
                borderColor: HIGHLIGHT_RING,
                borderWidth: 1.5,
                pointRadius: 3.5,
                pointHoverRadius: 6,
                order: -1,
            });
        }

        // syncHighlight's sibling for the gain/frequency chart.
        function syncGainHighlight() {
            if (!gainChart) return;

            gainChart.data.datasets = gainChart.data.datasets.filter(ds => ds.label !== HIGHLIGHT_LABEL);

            const hidden = new Set();
            gainChart.data.datasets.forEach((ds, i) => {
                if (gainChart.getDatasetMeta(i).hidden) hidden.add(ds.label);
            });

            const pts = gainHighlightSource.filter(p => !hidden.has(p.surface));
            if (pts.length === 0) return;

            gainChart.data.datasets.push({
                label: HIGHLIGHT_LABEL,
                data: pts,
                backgroundColor: pts.map(p => (surfaceColors[p.surface] || surfaceColors.unknown).border),
                borderColor: HIGHLIGHT_RING,
                borderWidth: 1.5,
                pointRadius: 3.5,
                pointHoverRadius: 6,
                order: -1,
            });
        }

        // Rebuilds the gain/frequency scatter from the same shownPoints/selected updateChart
        // just computed. Both parameters are optional: retuning (commit()/reset) has neither
        // in scope, so it falls back to the values updateChart last stashed at module level.
        function updateGainChart(shownPoints, selected) {
            if (!gainChart) return;
            if (shownPoints === undefined) shownPoints = gainPlotPoints;
            if (selected === undefined) selected = gainPlotSelected;

            const grouped = {};
            gainHighlightSource = [...selected]
                .map(d => ({
                    x: freqHzOf(snapOf(d)), y: gainDbOf(jerkOf(d)), frame: d.frame, surface: d.surface,
                }))
                .filter(audible);
            shownPoints.forEach(d => {
                const pt = { x: freqHzOf(snapOf(d)), y: gainDbOf(jerkOf(d)), frame: d.frame };
                if (!audible(pt)) return;
                if (!grouped[d.surface]) grouped[d.surface] = [];
                grouped[d.surface].push(pt);
            });

            const existing = new Map(gainChart.data.datasets.map(ds => [ds.label, ds]));

            gainChart.data.datasets = Object.entries(grouped).map(([surface, data]) => {
                const c = surfaceColors[surface] || surfaceColors.unknown;
                if (existing.has(surface)) {
                    const ds = existing.get(surface);
                    ds.data = data;
                    ds.backgroundColor = c.bg;
                    ds.borderColor = c.border;
                    return ds;
                }
                return {
                    label: surface,
                    data,
                    backgroundColor: c.bg,
                    borderColor: c.border,
                    borderWidth: 1,
                    pointRadius: 2.5,
                    pointHoverRadius: 5,
                };
            });

            syncGainHighlight();
            applyGainYBounds();
            gainChart.update('none');
        }

        function updateChart() {
            const coords = mapData[currentLapKey] || [];
            const grouped = {};

            // Plot the points whose track position is actually rendered in the map viewport.
            // Falls back to all points when there is no map geometry to test against.
            const canvas = document.getElementById('map-canvas');
            const mask = coords.length >= 2 ? computeVisibleMask(coords, canvas.width, canvas.height) : null;
            const shownPoints = mask ? allData.filter(d => mask[d.frame]) : allData.slice();
            const shown = shownPoints.length;

            // Emphasise the `highlightCount` plotted points nearest the point of interest.
            const poiFrame = distToFrame(poiDist);
            const selected = new Set(
                [...shownPoints]
                    .sort((a, b) => Math.abs(a.frame - poiFrame) - Math.abs(b.frame - poiFrame))
                    .slice(0, highlightCount)
            );

            highlightSource = [...selected].map(d => ({
                x: jerkOf(d), y: snapOf(d), dist: cumulativeDists[d.frame] ?? 0, frame: d.frame, surface: d.surface,
            }));
            shownPoints.forEach(d => {
                if (!grouped[d.surface]) grouped[d.surface] = [];
                grouped[d.surface].push({ x: jerkOf(d), y: snapOf(d), dist: cumulativeDists[d.frame] ?? 0, frame: d.frame });
            });

            const existing = new Map(chart.data.datasets.map(ds => [ds.label, ds]));
            const newDatasets = [];

            chart.data.datasets = Object.entries(grouped).map(([surface, data]) => {
                const c = surfaceColors[surface] || surfaceColors.unknown;
                if (existing.has(surface)) {
                    const ds = existing.get(surface);
                    ds.data = data;
                    ds.backgroundColor = c.bg;
                    ds.borderColor = c.border;
                    return ds;
                }
                const ds = {
                    label: surface,
                    data,
                    backgroundColor: alphaScale(c.bg, 0),
                    borderColor: alphaScale(c.border, 0),
                    _targetBg: c.bg,
                    _targetBorder: c.border,
                    borderWidth: 1,
                    pointRadius: 2.5,
                    pointHoverRadius: 5,
                };
                newDatasets.push(ds);
                return ds;
            });

            // Emphasise the POI-nearest points on top, honouring surface-legend visibility.
            syncHighlight();

            // Stash for the no-arg updateGainChart() calls (retuning has neither in scope).
            gainPlotPoints = shownPoints;
            gainPlotSelected = selected;
            updateGainChart(shownPoints, selected);

            // Compute nice target bounds directly from data — no extra renders
            const niceBounds = computeNiceBounds(chart.data.datasets);

            if (!displayedScales) {
                // First render — snap immediately, no animation
                displayedScales = { ...niceBounds };
                targetScales = { ...niceBounds };
            } else {
                // Set chase target; the animation loop will smoothly lerp toward it
                targetScales = { ...niceBounds };
                startScaleChase();
            }

            // Apply current displayed scales and render once
            applyScalesToChart(displayedScales);
            chart.update('none');

            if (fadeRaf) cancelAnimationFrame(fadeRaf);
            fadeStartTime = null;

            if (newDatasets.length > 0) {
                function fadeStep(ts) {
                    if (!fadeStartTime) fadeStartTime = ts;
                    const t = Math.min((ts - fadeStartTime) / FADE_DURATION, 1);
                    newDatasets.forEach(ds => {
                        ds.backgroundColor = alphaScale(ds._targetBg, t);
                        ds.borderColor = alphaScale(ds._targetBorder, t);
                    });
                    chart.update('none');
                    fadeRaf = t < 1 ? requestAnimationFrame(fadeStep) : null;
                }
                fadeRaf = requestAnimationFrame(fadeStep);
            }

            document.getElementById('sel-points').textContent = `${shown} / ${allData.length}`;

            updateSpeedChart(coords, mask);

            // Keep the waveform's highlight box in step with the POI/highlight, which can
            // change without re-fetching audio (e.g. dragging the POI within the section).
            if (waveBuffer) drawWave();
        }

        // ---------------------------------------------------------------------
        // Chassis haptic audio: fetch the rendered WAV for the visible track
        // section (and current tuning) from /audio, draw its waveform, and offer
        // playback with scrubbing. The audio is produced by the real app haptic
        // generators server-side (app/hapticcapture) — nothing is synthesized here.
        // ---------------------------------------------------------------------
        let audioCtx = null;
        let waveBuffer = null;        // decoded AudioBuffer for the current section
        let waveSource = null;        // active AudioBufferSourceNode while playing
        let wavePlaying = false;
        let wavePlayOffset = 0;       // seconds into the buffer the playhead sits at
        let wavePlayStartCtx = 0;     // audioCtx.currentTime when the current source started
        let waveRaf = null;
        let wavePeaks = null;         // { min:[], max:[] } envelope, one pair per canvas column
        let waveLastKey = '';
        let audioReqSeq = 0;          // guards against out-of-order fetch responses
        const tuneDefaults = {
            jerkCurve: 190, jerkPivot: 601, jerkPivotGain: -3.0, snapCurve: 310, snapMax: 90,
        };
        const tuneValues = { ...tuneDefaults };
        const TUNE_KEYS = ['jerkCurve', 'jerkPivot', 'jerkPivotGain', 'snapCurve', 'snapMax'];

        // Controls whose slider travel is geometric rather than linear. For these keys
        // the range input carries a 0..TUNE_SLIDER_STEPS position and the number box
        // keeps the real stored value; every other key uses both directly. jerkPivot
        // spans 1..20000 m/s^3, so a linear thumb would bury the useful region near 600
        // in the first few percent of travel.
        const TUNE_LOG_KEYS = new Set(['jerkPivot']);

        // Keys stored as a real number rather than an integer. jerkPivotGain is a
        // plain dB figure like every other gain, so it commits to a tenth of a dB
        // instead of being rounded to whole units like the rest.
        const TUNE_DECIMAL_KEYS = new Set(['jerkPivotGain']);

        // roundTuneValue snaps a committed value to the precision its key stores.
        function roundTuneValue(key, value) {
            return TUNE_DECIMAL_KEYS.has(key) ? Math.round(value * 10) / 10 : Math.round(value);
        }
        const TUNE_SLIDER_STEPS = 1000;

        function tuneValueAtPos(key, pos, lo, hi) {
            if (!TUNE_LOG_KEYS.has(key)) return pos;

            return lo * Math.pow(hi / lo, pos / TUNE_SLIDER_STEPS);
        }

        function tunePosForValue(key, value, lo, hi) {
            if (!TUNE_LOG_KEYS.has(key)) return value;

            const clamped = Math.min(hi, Math.max(lo, value));

            return Math.round(TUNE_SLIDER_STEPS * Math.log(clamped / lo) / Math.log(hi / lo));
        }

        function ensureAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function setWaveStatus(text) {
            document.getElementById('wave-status').textContent = text;
        }

        function setPlayIcon() {
            document.getElementById('wave-play').innerHTML = wavePlaying ? '&#10073;&#10073;' : '&#9654;';
        }

        function playheadSeconds() {
            if (!waveBuffer) return 0;
            let t = wavePlayOffset;
            if (wavePlaying) t += audioCtx.currentTime - wavePlayStartCtx;
            return Math.max(0, Math.min(t, waveBuffer.duration));
        }

        // Map the audio playhead back to a lap frame and hand it to the shared hover
        // follower, so playback moves the same map point, scatter point and speed marker
        // the mouse does. This is the inverse of seekToFrame: the section's frames are
        // laid out linearly across the rendered buffer.
        //
        // setHovered already returns early when the frame has not changed, which is what
        // keeps this cheap — the playhead advances every animation frame, but one
        // telemetry frame spans several of them and a map redraw walks the whole lap.
        function followPlayhead() {
            if (!waveBuffer || waveBuffer.duration <= 0 || !currentLapKey) return;

            const { startFrame, endFrame } = getFrameRange();
            const frac = playheadSeconds() / waveBuffer.duration;
            const frame = Math.max(startFrame, Math.min(endFrame,
                Math.round(startFrame + frac * (endFrame - startFrame))));

            setHovered(frame, 'playback');
        }

        function updateWaveTime() {
            const dur = waveBuffer ? waveBuffer.duration : 0;
            document.getElementById('wave-time').textContent =
                playheadSeconds().toFixed(2) + ' / ' + dur.toFixed(2) + ' s';
        }

        function currentAudioKey() {
            const replay = document.getElementById('replay-select').value;
            const { startFrame, endFrame } = getFrameRange();
            return [replay, currentLapKey, startFrame, endFrame,
                ...TUNE_KEYS.map(k => tuneValues[k]),
                useRaw ? 'raw' : 'filt'].join('|');
        }

        let audioRefreshTimer = null;
        function scheduleAudioRefresh() {
            clearTimeout(audioRefreshTimer);
            audioRefreshTimer = setTimeout(refreshAudio, 250);
        }

        async function refreshAudio() {
            if (!currentLapKey) return;

            const key = currentAudioKey();
            if (key === waveLastKey && waveBuffer) return;
            waveLastKey = key;

            const replay = document.getElementById('replay-select').value;
            const { startFrame, endFrame } = getFrameRange();
            const params = new URLSearchParams({
                replay, lap: String(currentLapKey),
                from: String(startFrame), to: String(endFrame),
                raw: useRaw ? '1' : '0',
            });
            TUNE_KEYS.forEach(k => params.set(k, String(tuneValues[k])));

            const seq = ++audioReqSeq;
            setWaveStatus('rendering…');

            try {
                const resp = await fetch('/api/tuneassist/audio?' + params.toString());
                if (!resp.ok) { if (seq === audioReqSeq) setWaveStatus('no audio'); return; }
                const raw = await resp.arrayBuffer();
                const decoded = await ensureAudioCtx().decodeAudioData(raw);
                if (seq !== audioReqSeq) return; // a newer request has superseded this one

                stopPlayback();
                waveBuffer = decoded;
                wavePlayOffset = 0;
                computeWavePeaks();
                drawWave();
                updateWaveTime();
                followPlayhead();
                setWaveStatus('');
            } catch (e) {
                if (seq === audioReqSeq) setWaveStatus('error');
            }
        }

        // Downsample the mono buffer to a per-column min/max envelope for drawing.
        function computeWavePeaks() {
            const canvas = document.getElementById('wave-canvas');
            const cols = Math.max(1, canvas.clientWidth);
            const data = waveBuffer.getChannelData(0);
            const per = data.length / cols;
            const mn = new Float32Array(cols);
            const mx = new Float32Array(cols);
            for (let c = 0; c < cols; c++) {
                const s = Math.floor(c * per);
                const e = Math.min(data.length, Math.floor((c + 1) * per));
                let lo = 1, hi = -1;
                for (let i = s; i < e; i++) {
                    const v = data[i];
                    if (v < lo) lo = v;
                    if (v > hi) hi = v;
                }
                if (e <= s) { lo = 0; hi = 0; }
                mn[c] = lo; mx[c] = hi;
            }
            wavePeaks = { min: mn, max: mx, cols };
        }

        function drawWave() {
            const canvas = document.getElementById('wave-canvas');
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
                canvas.width = w * dpr; canvas.height = h * dpr;
            }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Backdrop. clearRect leaves the canvas transparent so the themed
            // `canvas { background: var(--bs-content-bg) }` rule shows through;
            // painting a backdrop here would pin it to a fixed colour instead.
            ctx.clearRect(0, 0, w, h);

            const mid = h / 2;

            // Zero line
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

            if (wavePeaks) {
                ctx.strokeStyle = 'rgba(233,69,96,0.9)';
                ctx.beginPath();
                const cols = wavePeaks.cols;
                for (let c = 0; c < cols; c++) {
                    const x = (c / cols) * w + 0.5;
                    ctx.moveTo(x, mid - wavePeaks.max[c] * mid);
                    ctx.lineTo(x, mid - wavePeaks.min[c] * mid);
                }
                ctx.stroke();
            }

            // Highlight box: the span of the emphasised scatter points (highlightCount
            // frames around the POI) mapped onto this section's frame range, so the audio
            // under the highlighted points is boxed off (e.g. 15 points ≈ 250 ms).
            if (waveBuffer && highlightSource && highlightSource.length) {
                const { startFrame, endFrame } = getFrameRange();
                const span = Math.max(1, endFrame - startFrame);
                let lo = Infinity, hi = -Infinity;
                for (const p of highlightSource) {
                    if (p.frame < lo) lo = p.frame;
                    if (p.frame > hi) hi = p.frame;
                }
                const xL = Math.max(0, Math.min(w, ((lo - startFrame) / span) * w));
                const xR = Math.max(0, Math.min(w, ((hi - startFrame) / span) * w));
                if (xR > xL) {
                    // Colour the box by the surface at the POI, matching the map/speed markers.
                    const coords = mapData[currentLapKey] || [];
                    const pf = Math.max(0, Math.min(distToFrame(poiDist), coords.length - 1));
                    const sc = surfaceColors[(coords[pf] && coords[pf].surface)] || surfaceColors.unknown;
                    ctx.fillStyle = alphaScale(sc.bg, 0.4);
                    ctx.fillRect(xL, 0, xR - xL, h);
                    ctx.strokeStyle = sc.border;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(xL + 0.5, 0.5, (xR - xL) - 1, h - 1);
                }
            }

            // Hover marker: a secondary box tracking the frame hovered on the speed graph
            // / scatter plot, so the audio at the hovered point is located on the waveform.
            if (waveBuffer && hoveredFrame != null) {
                const { startFrame, endFrame } = getFrameRange();
                if (hoveredFrame >= startFrame && hoveredFrame <= endFrame) {
                    const span = Math.max(1, endFrame - startFrame);
                    const hx = ((hoveredFrame - startFrame) / span) * w;
                    const boxW = Math.max(4, w / span);
                    const bx = Math.max(0, Math.min(w - boxW, hx - boxW / 2));
                    ctx.fillStyle = 'rgba(255,255,255,0.22)';
                    ctx.fillRect(bx, 0, boxW, h);
                }
            }

            // Playhead
            if (waveBuffer) {
                const frac = waveBuffer.duration > 0 ? playheadSeconds() / waveBuffer.duration : 0;
                const px = frac * w;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
            }
        }

        function tickPlayhead() {
            if (!wavePlaying) return;
            if (playheadSeconds() >= waveBuffer.duration - 1e-3) {
                stopPlayback();
                wavePlayOffset = 0;
                drawWave(); updateWaveTime(); followPlayhead();
                return;
            }
            drawWave(); updateWaveTime(); followPlayhead();
            waveRaf = requestAnimationFrame(tickPlayhead);
        }

        function startPlayback() {
            if (!waveBuffer) return;
            const ctx = ensureAudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
            waveSource = ctx.createBufferSource();
            waveSource.buffer = waveBuffer;
            waveSource.connect(ctx.destination);
            wavePlayStartCtx = ctx.currentTime;
            waveSource.start(0, wavePlayOffset);
            wavePlaying = true;
            setPlayIcon();
            followPlayhead();
            cancelAnimationFrame(waveRaf);
            waveRaf = requestAnimationFrame(tickPlayhead);
        }

        // Pause: freeze the playhead at its current position.
        function pausePlayback() {
            if (waveSource) {
                wavePlayOffset = playheadSeconds();
                try { waveSource.onended = null; waveSource.stop(); } catch (e) { }
                waveSource = null;
            }
            wavePlaying = false;
            setPlayIcon();
            cancelAnimationFrame(waveRaf);
            drawWave(); updateWaveTime(); followPlayhead();
        }

        // Stop: silence without moving the stored offset (used before reload/seek).
        function stopPlayback() {
            if (waveSource) {
                try { waveSource.onended = null; waveSource.stop(); } catch (e) { }
                waveSource = null;
            }
            wavePlaying = false;
            setPlayIcon();
            cancelAnimationFrame(waveRaf);
        }

        function togglePlay() {
            if (!waveBuffer) return;
            if (wavePlaying) pausePlayback(); else startPlayback();
        }

        // Map a pointer x within the waveform to a lap frame index in the visible section.
        function frameAtPointer(clientX) {
            if (!currentLapKey) return null;
            const canvas = document.getElementById('wave-canvas');
            const rect = canvas.getBoundingClientRect();
            if (rect.width <= 0) return null;
            const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const { startFrame, endFrame } = getFrameRange();
            return Math.max(startFrame, Math.min(endFrame, Math.round(startFrame + frac * (endFrame - startFrame))));
        }

        // Move the playhead to a lap frame's position within the visible section.
        function seekToFrame(frame) {
            if (!waveBuffer) return;
            const { startFrame, endFrame } = getFrameRange();
            const span = Math.max(1, endFrame - startFrame);
            const frac = Math.max(0, Math.min(1, (frame - startFrame) / span));
            const wasPlaying = wavePlaying;
            stopPlayback();
            wavePlayOffset = frac * waveBuffer.duration;
            if (wasPlaying) startPlayback(); else { drawWave(); updateWaveTime(); followPlayhead(); }
        }

        // Leftmost frame of the current primary highlight box (null if none).
        function boxLeftFrame() {
            if (!highlightSource || !highlightSource.length) return null;
            let lo = Infinity;
            for (const p of highlightSource) if (p.frame < lo) lo = p.frame;
            return lo === Infinity ? null : lo;
        }

        // Park the playhead at the left edge of the primary highlight box.
        function seekToBoxLeft() {
            const lo = boxLeftFrame();
            if (waveBuffer && lo != null) seekToFrame(lo);
        }

        // Reposition the POI so the highlight box's LEFT edge lands on targetLeft. The box
        // is centred on the POI, so we measure its half-span (centred on the target) then
        // shift the POI right by that much. Used on drag-release so the box starts where
        // the playhead was dropped.
        function setPoiSoBoxLeftAt(targetLeft) {
            if (!cumulativeDists.length) return;
            const maxF = cumulativeDists.length - 1;
            const clampF = (f) => Math.max(0, Math.min(maxF, f));

            poiDist = Math.round(cumulativeDists[clampF(targetLeft)] ?? 0);
            updateChart(); // recompute the box centred on the target to read its half-span
            const lo = boxLeftFrame();
            const half = lo != null ? Math.max(0, distToFrame(poiDist) - lo) : 0;

            poiDist = Math.round(cumulativeDists[clampF(targetLeft + half)] ?? 0);
            updateSelectionInfo();
            updateChart();
            drawMap(currentLapKey);
            scheduleUrlUpdate();
        }

        // Scrub: set the playhead from a pointer x within the waveform canvas.
        function seekToPointer(clientX) {
            if (!waveBuffer) return;
            const canvas = document.getElementById('wave-canvas');
            const rect = canvas.getBoundingClientRect();
            const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const wasPlaying = wavePlaying;
            stopPlayback();
            wavePlayOffset = frac * waveBuffer.duration;
            if (wasPlaying) startPlayback(); else { drawWave(); updateWaveTime(); followPlayhead(); }
        }

        function setupAudioUI() {
            document.getElementById('wave-play').addEventListener('click', togglePlay);

            const canvas = document.getElementById('wave-canvas');
            let scrubbing = false;
            let didDrag = false;
            canvas.addEventListener('pointerdown', (e) => {
                scrubbing = true; didDrag = false; canvas.setPointerCapture(e.pointerId);
                seekToPointer(e.clientX); // move the playhead to the press point
            });
            canvas.addEventListener('pointermove', (e) => {
                if (scrubbing) { didDrag = true; seekToPointer(e.clientX); return; }
                // Act as a hover source: sync the hovered frame to the speed/scatter/map.
                const f = frameAtPointer(e.clientX);
                if (f != null) setHovered(f, 'wave');
            });
            canvas.addEventListener('pointerup', (e) => {
                if (scrubbing) {
                    const f = frameAtPointer(e.clientX);
                    if (didDrag) {
                        // Drag-release: box's left edge lands where the playhead was dropped.
                        if (f != null) { setPoiSoBoxLeftAt(f); seekToBoxLeft(); }
                    } else if (f != null && cumulativeDists.length) {
                        // Click: POI at the clicked frame; playhead parks at the box's left edge.
                        poiDist = Math.round(cumulativeDists[f] ?? 0);
                        updateSelectionInfo();
                        updateChart();
                        drawMap(currentLapKey);
                        scheduleUrlUpdate();
                        seekToBoxLeft();
                    }
                }
                scrubbing = false;
            });
            canvas.addEventListener('pointercancel', () => { scrubbing = false; didDrag = false; });
            canvas.addEventListener('pointerleave', () => { if (!scrubbing) setHovered(null, 'wave'); });

            TUNE_KEYS.forEach(k => {
                const slider = document.getElementById('tune-' + k);
                const box = document.getElementById('out-' + k);
                // The bounds always come from the number box, which is in real stored
                // units for every key — the range input may be carrying a position.
                const lo = Number(box.min), hi = Number(box.max);

                // syncBox is false while the user is typing, so a partially entered
                // number is not rewritten under the cursor. syncSlider is false while the
                // user is dragging, so rounding the value does not snap the thumb out
                // from under them: on a geometric scale many positions share one value.
                const commit = (raw, { syncBox = true, syncSlider = true } = {}) => {
                    let v = roundTuneValue(k, Number(raw));
                    if (!Number.isFinite(v)) return;
                    v = Math.min(hi, Math.max(lo, v));
                    tuneValues[k] = v;
                    if (syncSlider) slider.value = tunePosForValue(k, v, lo, hi);
                    if (syncBox) box.value = v;
                    scheduleAudioRefresh();
                    updateGainChart();
                };

                slider.addEventListener('input', () => commit(
                    tuneValueAtPos(k, Number(slider.value), lo, hi), { syncSlider: false },
                ));

                box.addEventListener('input', () => {
                    const v = Number(box.value);
                    if (box.value !== '' && Number.isFinite(v) && v >= lo && v <= hi) {
                        commit(v, { syncBox: false });
                    }
                });

                // Enter or blur clamps whatever was typed and normalises the box.
                box.addEventListener('change', () => {
                    commit(box.value === '' ? tuneValues[k] : box.value);
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') box.blur();
                });
            });

            document.getElementById('tune-reset').addEventListener('click', () => {
                TUNE_KEYS.forEach(k => {
                    tuneValues[k] = tuneDefaults[k];
                });
                applyTuneToControls();
                scheduleAudioRefresh();
                updateGainChart();
            });

            document.getElementById('tune-commit').addEventListener('click', commitTuning);

            // Re-render the waveform envelope on resize (canvas column count changes).
            window.addEventListener('resize', () => { if (waveBuffer) { computeWavePeaks(); drawWave(); } });

            applyTuneToControls();

            // Load the shipped defaults so the sliders start where the live app does.
            fetch('/api/tuneassist/tuning-defaults').then(r => r.json()).then(d => {
                TUNE_KEYS.forEach(k => { if (Number.isFinite(d[k])) { tuneDefaults[k] = d[k]; tuneValues[k] = d[k]; } });
                applyTuneToControls();
                if (d.pulseLimits) pulseLimits = { ...pulseLimits, ...d.pulseLimits };
                if (gainChart) { applyGainAxisBounds(); updateGainChart(); }
            }).catch(() => { });
        }

        // The curve exponents are held here as the raw thousandths the sliders show
        // (jerkCurve 190, snapCurve 310), but POST /api/config takes them as the
        // fraction and multiplies by 1000 on the way in. Everything else is sent as
        // it stands. Getting this wrong is silent — the value simply lands a factor
        // of 1000 out — so the scaling is listed per key rather than applied broadly.
        function tuningToConfigPayload() {
            return {
                jerkCurve: tuneValues.jerkCurve / 1000,
                jerkPivot: tuneValues.jerkPivot,
                jerkPivotGain: tuneValues.jerkPivotGain,
                snapCurve: tuneValues.snapCurve / 1000,
                snapMax: tuneValues.snapMax,
            };
        }

        // Write the current knob positions into the haptics section of the config
        // file. The endpoint applies them to the running app and persists them in one
        // step, so this is the same path the settings page saves through — including
        // the shared navbar spinner/tick, rather than a status line of its own.
        async function commitTuning() {
            const button = document.getElementById('tune-commit');
            const status = document.getElementById('wave-status');

            button.disabled = true;
            if (typeof window.showNavbarStatus === 'function') window.showNavbarStatus('saving');

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ haptics: tuningToConfigPayload() }),
                });

                const result = await response.json().catch(() => null);
                if (!response.ok || (result && result.status !== 'success')) {
                    throw new Error((result && (result.message || (result.errors || []).join('; '))) || ('HTTP ' + response.status));
                }

                if (typeof window.showNavbarStatus === 'function') window.showNavbarStatus('success');
                status.textContent = 'Committed to config';
                setTimeout(() => {
                    if (status.textContent === 'Committed to config') status.textContent = '';
                }, 3000);
            } catch (error) {
                console.error('Failed to commit tuning:', error);
                if (typeof window.showNavbarStatus === 'function') window.showNavbarStatus('error');
                status.textContent = 'Commit failed: ' + error.message;
            } finally {
                button.disabled = false;
            }
        }

        function applyTuneToControls() {
            TUNE_KEYS.forEach(k => {
                const box = document.getElementById('out-' + k);
                const lo = Number(box.min), hi = Number(box.max);
                document.getElementById('tune-' + k).value = tunePosForValue(k, tuneValues[k], lo, hi);
                box.value = tuneValues[k];
            });
        }

        setupAudioUI();
        init();
    </script>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>

</html>
