<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/telemetry.css">
    <!-- Include SciChart.js v4 -->
    <script src="https://cdn.jsdelivr.net/npm/scichart@4/_wasm/scichart.browser.js" crossorigin="anonymous"></script>
    <script>
        const currentPageId = 'dev';
        const connectionStatusHTML = `
          <div id="connection-status" style="display: flex; align-items: center; font-size: 14px;">
            <div id="status-indicator"
              style="width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background-color: #ff6b6b;"></div>
            <span id="status-text">Connecting...</span>
            <button id="reconnect-btn"
              style="margin-left: 10px; padding: 2px 8px; background: rgba(81, 207, 102, 0.2); border: 1px solid #51cf66; color: #51cf66; border-radius: 4px; cursor: pointer; font-size: 12px; display: none;">Reconnect</button>
          </div>`;
    </script>
    <script src="/js/navigation.js"></script>
    <title>Simtezilo</title>
</head>

<body>
    <div id="navigation"></div>

    <div class="content-container">
        <!-- Create the Div to host the SciChartSurface -->
        <div style="width: 100%; overflow: hidden;">
            <div id="scichart-root-1" style="width: 49%; height: 300px; float: left;"></div>
            <div id="scichart-root-2" style="width: 49%; height: 300px; margin-left: 50%;"></div>
        </div>
        <div style="width: 100%; overflow: hidden; margin-top: 10px">
            <div id="scichart-root-3" style="width: 49%; height: 300px; float: left;"></div>
            <div id="scichart-root-4" style="width: 49%; height: 300px; margin-left: 50%;"></div>
        </div>
        <div style="width: 100%; overflow: hidden; margin-top: 10px">
            <div id="scichart-root-5" style="width: 49%; height: 300px; float: left;"></div>
            <div id="scichart-root-6" style="width: 49%; height: 300px; margin-left: 50%;"></div>
        </div>
        <div style="width: 100%; overflow: hidden; margin-top: 10px">
            <div id="scichart-root-7" style="width: 49%; height: 300px; float: left;"></div>
            <div id="scichart-root-8" style="width: 49%; height: 300px; margin-left: 50%;"></div>
        </div>
        <div style="width: 100%; overflow: hidden; margin-top: 10px">
            <div id="scichart-root-9" style="width: 49%; height: 300px; float: left;"></div>
            <div id="scichart-root-10" style="width: 49%; height: 300px; margin-left: 50%;"></div>
        </div>
    </div>
    <!-- The JavaScript to create a SciChartSurface -->
    <script src="/js/scichart.js" data-chart-config="dev"></script>
</body>

</html>
