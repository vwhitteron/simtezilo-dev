<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family:Arial, Helvetica, sans-serif;
        color: #f9e67f;
        background-color: #000000;
      }
    </style>
    <!-- Include SciChart.js -->
    <script
      src="https://cdn.jsdelivr.net/npm/scichart@3.5/_wasm/scichart.browser.js"
      crossorigin="anonymous"
    ></script>
    <title>GT Telemetry</title>
  </head>
  <body >
    <h1>GT Telemetry</h1>
    <!-- Create the Div to host the SciChartSurface -->
    <div style="width: 100%; overflow: hidden;">
      <div id="scichart-root-1" style="width: 49%; height: 300px; float: left;"></div>
      <div id="scichart-root-2" style="width: 51%; height: 300px; margin-left: 50%;"></div>
    </div>
    <div style="width: 100%; overflow: hidden; margin-top: 10px">
      <div id="scichart-root-3" style="width: 49%; height: 300px; float: left;"></div>
      <div id="scichart-root-4" style="width: 51%; height: 300px; margin-left: 50%;"></div>
    </div>
    <div style="width: 100%; overflow: hidden; margin-top: 10px">
      <div id="scichart-root-5" style="width: 49%; height: 300px; float: left;"></div>
      <div id="scichart-root-6" style="width: 51%; height: 300px; margin-left: 50%;"></div>
    </div>
    <!-- The JavaScript to create a SciChartSurface -->
    <script src="/js/scichart.js"></script>
  </body>
</html>
