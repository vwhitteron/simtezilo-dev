[pitRadio]
# Enable pit radio notifications
enabled = false

# Gap between sending pit radio messages in milliseconds
messageSendIntervalMs = 2000

[pitRadio.discord]
# The Discord API token to connect to the Discord Bot
# token = "YOUR_DISCORD_BOT_TOKEN"

# The Discord guild ID to send voice messages to
# guildID = "YOUR_DISCORD_GUILD_ID"

# The Discord channel ID to send messages to
# channelID = "YOUR_DISCORD_CHANNEL_ID"

# The Discord voice channel ID to send voice messages to
# voiceChannelID = "YOUR_DISCORD_VOICE_CHANNEL_ID"

[pitRadio.Notifications]
# Enable notification of lap times
lapTimesEnabled = true

# The maximum lap time delta in seconds to trigger a notification
lapTimesMaxDeltaSeconds = 2.0

# Enable notifiactions of the current race lap
raceLapsEnabled = true

# The lap interval at which race lap notifications will be sent
raceLapsIntervalLaps = 1

# The number of laps remaining to start countdown notifications
raceLapsCountdownLaps = 3

# Enable notifications of percentage race progress
raceProgressEnabled = true

# The minimum race length in laps where race progress notifications will be sent
raceProgressMinLaps = 10

# The interval in percentage at which race progress notifications will be sent
raceProgressIntervalPc = 25

# Enable notification of the circuit name when the circuit has been confidently identified
circuitMatchingEnabled = true

[pitRadio.tyreMonitoring]
# Enable tyre temperature monitoring and notifications
enabled = true

# Optimal tyre temperature (Celsius) represents the center for a range
temperatureOptimalCelsius = 81

# Optimal tyre temperature window (Celsius) around the optimal temperature (optimal ± window/2)
temperatureOptimalWindow = 6

# Sub-optimal tyre temperature margin (Celsius) beyond operating window (optimal ± window/2 ± margin)
# Temperatures in this range will result in under/over temp warnings
temperatureMarginCelsius = 3

[pitRadio.fuelMonitoring]
# Enable fuel monitoring and notifications
enabled = true

# Send a pre-warning notification this many laps before refuelling is required
fuelPreWarnNotifyLaps = 2

# Lap interval to send fuel strategy notifications
fuelStrategyNotifyLaps = 5

# Fuel range safety margin in fractions of a lap (0.0 to 1.0)
fuelRangeSafetyMarginLaps = 0.2

# Fuel range safety margin in meters (used when lap distance is unknown)
fuelRangeSafetyMarginMeters = 750
