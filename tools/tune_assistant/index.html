<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap vs Jerk - Telemetry Scatter Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 1.4em;
            color: #f0f0f0;
        }

        .lap-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            gap: 10px 28px;
            margin-bottom: 16px;
        }

        .lap-row .lap-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lap-row label {
            font-size: 0.95em;
            color: #ccc;
        }

        .lap-row select {
            background: #16213e;
            color: #e0e0e0;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.9em;
            cursor: pointer;
        }

        .lap-row select:focus {
            outline: none;
            border-color: #e94560;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            cursor: pointer;
        }

        .toggle-switch input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-switch .slider {
            position: absolute;
            inset: 0;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 22px;
            transition: background 0.15s, border-color 0.15s;
        }

        .toggle-switch .slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            top: 2px;
            background: #e0e0e0;
            border-radius: 50%;
            transition: transform 0.15s;
        }

        .toggle-switch input:checked + .slider {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .toggle-switch input:checked + .slider::before {
            transform: translateX(18px);
        }

        .toggle-switch input:focus-visible + .slider {
            border-color: #e94560;
        }

        .chart-container {
            position: relative;
            flex: 1 1 500px;
            min-width: 0;
            transition: flex-basis 0.3s ease, width 0.3s ease;
        }

        canvas {
            background: #16213e;
            border-radius: 8px;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .speed-panel {
            margin-top: 16px;
        }

        .speed-panel h3 {
            text-align: center;
            font-size: 0.72em;
            color: #888;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .speed-container {
            position: relative;
            height: 150px;
        }

        .content-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .map-widget {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 8px 8px 6px;
        }

        .map-widget h3 {
            text-align: center;
            font-size: 0.72em;
            color: #888;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #map-canvas {
            display: block;
            cursor: grab;
        }

        #map-canvas.dragging {
            cursor: grabbing;
        }



        .info-widget {
            flex: 0 0 220px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 8px 12px 10px;
        }

        .info-widget h3 {
            text-align: center;
            font-size: 0.72em;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .info-widget dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 3px 8px;
            font-size: 0.78em;
        }

        .info-widget dt {
            color: #888;
            text-align: right;
        }

        .info-widget dd {
            color: #e0e0e0;
            margin: 0;
        }

        .sidebar {
            flex: 0 0 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>

<body>
    <h1>Snap vs Jerk &mdash; Telemetry Scatter Chart</h1>
    <div class="lap-row">
        <div class="lap-group">
            <label for="replay-select">Replay:</label>
            <select id="replay-select"></select>
        </div>
        <div class="lap-group">
            <label for="lap-select">Lap:</label>
            <select id="lap-select"></select>
        </div>
        <div class="lap-group">
            <label for="filter-toggle">Filter:</label>
            <label class="toggle-switch">
                <input type="checkbox" id="filter-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="lap-group">
            <label for="highlight-count">Highlight:</label>
            <select id="highlight-count">
            <option value="15">250 ms</option>
            <option value="30">500 ms</option>
            <option value="60">1 s</option>
            <option value="120">2 s</option>
            <option value="240">4 s</option>
            </select>
        </div>
    </div>
    <div class="content-row">
        <div class="chart-container">
            <canvas id="chart"></canvas>
            <div class="speed-panel">
                <h3>Speed</h3>
                <div class="speed-container">
                    <canvas id="speed-chart"></canvas>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="map-widget">
                <h3 id="map-title">Circuit Map</h3>
                <canvas id="map-canvas" width="220" height="220"></canvas>
            </div>
            <div class="info-widget" id="selection-widget">
                <h3>Info</h3>
                <dl>
                    <dt>POI</dt>
                    <dd id="sel-poi">—</dd>
                    <dt>Zoom</dt>
                    <dd id="sel-zoom">—</dd>
                    <dt>Points</dt>
                    <dd id="sel-points">—</dd>
                </dl>
            </div>
            <div class="info-widget" id="vehicle-widget">
                <h3>Vehicle</h3>
                <dl>
                    <dt>Make</dt>
                    <dd id="v-make">—</dd>
                    <dt>Model</dt>
                    <dd id="v-model">—</dd>
                    <dt>Year</dt>
                    <dd id="v-year">—</dd>
                    <dt>Category</dt>
                    <dd id="v-category">—</dd>
                    <dt>Drivetrain</dt>
                    <dd id="v-drivetrain">—</dd>
                </dl>
            </div>
        </div>
    </div>

    <script>
        const surfaceColors = {
            tarmac: { bg: 'rgba(54, 162, 235, 0.5)', border: 'rgba(54, 162, 235, 1)' },
            concrete: { bg: 'rgba(153, 102, 255, 0.5)', border: 'rgba(153, 102, 255, 1)' },
            grass: { bg: 'rgba(90, 235, 90, 0.55)', border: 'rgba(90, 235, 90, 1)' },
            dirt: { bg: 'rgba(205, 133, 63, 0.5)', border: 'rgba(205, 133, 63, 1)' },
            sand: { bg: 'rgba(244, 208, 63, 0.5)', border: 'rgba(244, 208, 63, 1)' },
            unknown: { bg: 'rgba(160, 160, 160, 0.5)', border: 'rgba(160, 160, 160, 1)' },
        };

        let lapData = {};
        let mapData = {};
        let allData = [];
        let chart = null;
        let speedChart = null;
        let speeds = [];            // per-frame ground speed (km/h) from telemetry
        let rangeStart = 0;
        let rangeEnd = 100;
        // When the visible track section straddles the start/finish line, the speed chart
        // plots the trailing (high-distance) part shifted back by one lap length so the
        // section reads as one continuous trace instead of two pieces at opposite ends of
        // the distance axis. This threshold is the distance at/above which that shift
        // applies (null when no wrap). speedDisplayX() maps a true distance to the plotted
        // x, and is shared by the trace and the hover/POI markers so they stay aligned.
        let speedWrapThreshold = null;
        let poiDist = 0;            // point-of-interest distance along lap (metres)
        let highlightCount = 15;    // number of plotted points to emphasise near the POI
        let useRaw = false;         // false = processed (device) jerk/snap, true = raw (ungated)

        // Active jerk/snap accessors: switch the whole plot between the processed
        // (live-path) fields and the raw (ungated) fields the backend ships alongside.
        const jerkOf = (d) => useRaw ? d.jerkRaw : d.jerk;
        const snapOf = (d) => useRaw ? d.snapRaw : d.snap;
        let currentLapKey = null;
        let pendingLap = null;      // lap key from the URL, applied once on the initial replay load
        let pendingView = null;     // {zoom,panx,pany,poi} from the URL, applied once with the initial lap
        const HIGHLIGHT_LABEL = 'point of interest';             // scatter dataset label (hidden from legend)
        const HIGHLIGHT_RING = '#ffffff';                        // white outline on the emphasised points
        let highlightSource = [];                                // {x,y,dist,frame,surface} of POI-nearest points
        let cumulativeDists = [];
        let totalDist = 0;
        let mapZoom = 1;
        let mapPanX = 0;
        let mapPanY = 0;
        let mapZoomedToRange = false;
        let hoveredFrame = null;

        let fadeRaf = null;
        let fadeStartTime = null;
        const FADE_DURATION = 250;

        // Scale chase animation state
        const SCALE_LERP = 0.12;          // per-frame lerp factor (0–1, higher = faster)
        const SCALE_SNAP_THRESHOLD = 0.5; // close-enough threshold to stop lerping
        let scaleChaseRaf = null;
        let displayedScales = null;       // { xMin, xMax, yMin, yMax } currently shown
        let targetScales = null;          // { xMin, xMax, yMin, yMax } we're chasing toward

        function alphaScale(colorStr, t) {
            return colorStr.replace(/,([\s\d.]+)\)$/, (_, a) => `,${parseFloat(a) * t})`);
        }

        // Reflect the current control + map state into the URL query string so a refresh
        // (or a shared link) restores the same replay/lap/filter/highlight/viewport/POI.
        function updateUrl() {
            const params = new URLSearchParams();
            const replay = document.getElementById('replay-select').value;
            const lap = document.getElementById('lap-select').value;
            const highlight = document.getElementById('highlight-count').value;
            const filter = document.getElementById('filter-toggle').checked;
            if (replay) params.set('replay', replay);
            if (lap) params.set('lap', lap);
            if (highlight) params.set('highlight', highlight);
            params.set('filter', filter ? '1' : '0');
            // Map viewport + point of interest. Only emit zoom/pan once the map is actually
            // zoomed in (default full-circuit view needs no restoring).
            if (mapZoom !== 1 || mapPanX !== 0 || mapPanY !== 0) {
                params.set('zoom', mapZoom.toFixed(4));
                params.set('panx', mapPanX.toFixed(1));
                params.set('pany', mapPanY.toFixed(1));
            }
            if (poiDist > 0) params.set('poi', String(Math.round(poiDist)));
            history.replaceState(null, '', '?' + params.toString());
        }

        // Map pan/zoom fire on every drag and wheel tick; debounce the URL rewrite so we
        // don't hammer history.replaceState during a continuous gesture.
        let urlUpdateTimer = null;
        function scheduleUrlUpdate() {
            clearTimeout(urlUpdateTimer);
            urlUpdateTimer = setTimeout(updateUrl, 200);
        }

        // Restore a saved map viewport / POI onto the current lap, then re-derive the range
        // and redraw. Used once on initial load for the lap named in the URL.
        function applyView(v) {
            if (Number.isFinite(v.zoom)) mapZoom = Math.max(1, Math.min(v.zoom, 20));
            if (Number.isFinite(v.panx)) mapPanX = v.panx;
            if (Number.isFinite(v.pany)) mapPanY = v.pany;
            mapZoomedToRange = false;
            if (Number.isFinite(v.poi)) poiDist = Math.max(0, Math.min(v.poi, totalDist));
            syncRangeToViewport();   // re-derive selection from the restored viewport (also redraws the chart)
            drawMap(currentLapKey);
            updateUrl();             // keep the URL in step with the values we actually clamped to
        }

        async function init() {
            const params = new URLSearchParams(location.search);

            const replaysResp = await fetch('/replays');
            const replaysJson = await replaysResp.json();
            const replayFiles = replaysJson.replays || [];

            const replaySelectEl = document.getElementById('replay-select');
            replayFiles.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                replaySelectEl.appendChild(opt);
            });

            // Restore filter/highlight from the URL before the first chart draw.
            const filterEl = document.getElementById('filter-toggle');
            const filterParam = params.get('filter');
            if (filterParam !== null) {
                filterEl.checked = filterParam !== '0';
                useRaw = !filterEl.checked;
            }

            const highlightEl = document.getElementById('highlight-count');
            const highlightParam = params.get('highlight');
            if (highlightParam !== null && [...highlightEl.options].some(o => o.value === highlightParam)) {
                highlightEl.value = highlightParam;
                highlightCount = parseInt(highlightParam);
            }

            pendingLap = params.get('lap');
            if (params.has('zoom') || params.has('poi')) {
                pendingView = {
                    zoom: parseFloat(params.get('zoom')),
                    panx: parseFloat(params.get('panx')),
                    pany: parseFloat(params.get('pany')),
                    poi: parseFloat(params.get('poi')),
                };
            }

            replaySelectEl.addEventListener('change', () => loadReplay(replaySelectEl.value));

            document.getElementById('lap-select').addEventListener('change', (e) => selectLap(e.target.value));

            highlightEl.addEventListener('change', (e) => {
                highlightCount = parseInt(e.target.value);
                updateUrl();
                updateChart();
            });

            filterEl.addEventListener('change', (e) => {
                useRaw = !e.target.checked;
                updateUrl();
                updateChart();
            });

            initMapInteraction();

            if (replayFiles.length > 0) {
                const replayParam = params.get('replay');
                const initialReplay = replayParam && replayFiles.includes(replayParam)
                    ? replayParam
                    : replayFiles[0];
                replaySelectEl.value = initialReplay;
                await loadReplay(initialReplay);
            }
        }

        async function loadReplay(filename) {
            const replaySelectEl = document.getElementById('replay-select');
            replaySelectEl.disabled = true;

            const resp = await fetch('/data?replay=' + encodeURIComponent(filename));
            const json = await resp.json();

            lapData = json.data;
            mapData = json.map || {};

            // Populate metadata panels
            const meta = json.metadata || {};
            document.getElementById('map-title').textContent = meta.circuitVariation || meta.circuitName || 'Circuit Map';
            document.getElementById('v-make').textContent = meta.vehicleMake || '—';
            document.getElementById('v-model').textContent = meta.vehicleModel || '—';
            document.getElementById('v-year').textContent = meta.vehicleYear || '—';
            document.getElementById('v-category').textContent = meta.vehicleCategory || '—';
            document.getElementById('v-drivetrain').textContent = meta.vehicleDrivetrain || '—';

            // Rebuild lap dropdown
            const lapSelectEl = document.getElementById('lap-select');
            lapSelectEl.innerHTML = '';
            json.laps.forEach(lap => {
                const opt = document.createElement('option');
                opt.value = String(lap);
                opt.textContent = String(lap);
                lapSelectEl.appendChild(opt);
            });

            if (json.laps.length > 0) {
                const lapKeys = json.laps.map(String);
                const urlLapMatched = pendingLap !== null && lapKeys.includes(pendingLap);
                const targetLap = urlLapMatched ? pendingLap : lapKeys[0];
                pendingLap = null;  // consumed; later replay switches default to the first lap
                selectLap(targetLap);

                // Restore the saved viewport/POI once, only onto the lap named in the URL
                // (selectLap has just reset both to defaults).
                if (urlLapMatched && pendingView) {
                    applyView(pendingView);
                }
                pendingView = null;
            }

            replaySelectEl.disabled = false;
        }

        function selectLap(lapKey) {
            currentLapKey = lapKey;
            allData = lapData[lapKey] || [];
            document.getElementById('lap-select').value = lapKey;
            updateUrl();

            const coords = mapData[lapKey] || [];
            cumulativeDists = [0];
            // Ground speed comes straight from telemetry (m/s), converted to km/h — not derived
            // from position deltas, which amplified glitches into impossible spikes.
            speeds = coords.map(c => (c.speed ?? 0) * 3.6);
            for (let i = 1; i < coords.length; i++) {
                const dx = coords[i].x - coords[i - 1].x;
                const dz = coords[i].z - coords[i - 1].z;
                cumulativeDists.push(cumulativeDists[i - 1] + Math.sqrt(dx * dx + dz * dz));
            }
            totalDist = cumulativeDists.length > 0 ? cumulativeDists[cumulativeDists.length - 1] : 0;

            mapZoom = 1;
            mapPanX = 0;
            mapPanY = 0;
            mapZoomedToRange = false;

            // Full lap selected by default; POI at the start. Both are driven by the map
            // (zoom/pan sets the range, dragging the marker sets the POI).
            rangeStart = 0;
            rangeEnd = totalDist;
            poiDist = 0;
            updateSelectionInfo();

            if (!chart) {
                createChart();
            }
            if (!speedChart) {
                createSpeedChart();
            }
            // Reset scale chase so new lap snaps to correct bounds immediately
            if (scaleChaseRaf) { cancelAnimationFrame(scaleChaseRaf); scaleChaseRaf = null; }
            displayedScales = null;
            targetScales = null;
            updateChart();
            drawMap(lapKey);
        }

        function distToFrame(dist) {
            if (cumulativeDists.length === 0) return 0;
            let lo = 0, hi = cumulativeDists.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (cumulativeDists[mid] < dist) lo = mid + 1;
                else hi = mid;
            }
            return lo;
        }

        function getFrameRange(coordCount) {
            const startFrame = distToFrame(rangeStart);
            const endFrame = distToFrame(rangeEnd);
            return { startFrame, endFrame };
        }

        function formatDist(meters) {
            return meters >= 1000
                ? (meters / 1000).toFixed(2) + '\u202fkm'
                : Math.round(meters) + '\u202fm';
        }

        // Refresh the read-only Selection panel below the map.
        function updateSelectionInfo() {
            document.getElementById('sel-poi').textContent = totalDist > 0 ? formatDist(poiDist) : '—';
            document.getElementById('sel-zoom').textContent = totalDist > 0 ? mapZoom.toFixed(2) + '×' : '—';
        }

        // Compute pan/zoom so the selected range fills the map canvas with a margin.
        // Uses the same coordinate-to-canvas mapping as drawMap (at identity transform).
        function zoomMapToSelection() {
            const coords = mapData[currentLapKey] || [];
            const canvas = document.getElementById('map-canvas');
            const W = canvas.width;
            const H = canvas.height;

            if (coords.length < 2) return;

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            coords.forEach(c => {
                if (c.x < minX) minX = c.x;
                if (c.x > maxX) maxX = c.x;
                if (c.z < minZ) minZ = c.z;
                if (c.z > maxZ) maxZ = c.z;
            });

            const pad = 12;
            const rangeX = maxX - minX || 1;
            const rangeZ = maxZ - minZ || 1;
            const scale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeZ);
            const offsetX = pad + ((W - pad * 2) - rangeX * scale) / 2;
            const offsetZ = pad + ((H - pad * 2) - rangeZ * scale) / 2;

            const toCanvas = (x, z) => ({
                cx: offsetX + (x - minX) * scale,
                cy: offsetZ + (z - minZ) * scale,
            });

            const { startFrame, endFrame } = getFrameRange(coords.length);
            const selStart = Math.max(0, Math.min(startFrame, coords.length - 1));
            const selEnd = Math.max(0, Math.min(endFrame, coords.length - 1));

            if (selEnd <= selStart) return;

            let cxMin = Infinity, cxMax = -Infinity, cyMin = Infinity, cyMax = -Infinity;
            for (let i = selStart; i <= selEnd; i++) {
                const pt = toCanvas(coords[i].x, coords[i].z);
                if (pt.cx < cxMin) cxMin = pt.cx;
                if (pt.cx > cxMax) cxMax = pt.cx;
                if (pt.cy < cyMin) cyMin = pt.cy;
                if (pt.cy > cyMax) cyMax = pt.cy;
            }

            const MARGIN = 20; // canvas pixels of margin around the selection
            const selW = cxMax - cxMin || 1;
            const selH = cyMax - cyMin || 1;
            const zoom = Math.min((W - MARGIN * 2) / selW, (H - MARGIN * 2) / selH);

            // Centre of the selection in canvas space
            const selCX = (cxMin + cxMax) / 2;
            const selCY = (cyMin + cyMax) / 2;

            // After applying the transform (translate to centre, scale, translate back),
            // the canvas-space point (selCX, selCY) maps to W/2, H/2 when pan is:
            mapZoom = zoom;
            // Transform: tx = zoom*(cx - W/2) + W/2 + panX; centre selCX → W/2 => panX = zoom*(W/2 - selCX)
            mapPanX = zoom * (W / 2 - selCX);
            mapPanY = zoom * (H / 2 - selCY);
        }

        // Set the start/finish range to the lap-distance span of the track currently visible in
        // the map viewport. Projects each coord through the same base mapping as drawMap and then
        // the pan/zoom transform, keeping points that land inside the canvas bounds.
        function syncRangeToViewport() {
            const coords = mapData[currentLapKey] || [];
            if (coords.length < 2 || totalDist <= 0) return;

            const canvas = document.getElementById('map-canvas');
            const W = canvas.width;
            const H = canvas.height;

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            coords.forEach(c => {
                if (c.x < minX) minX = c.x;
                if (c.x > maxX) maxX = c.x;
                if (c.z < minZ) minZ = c.z;
                if (c.z > maxZ) maxZ = c.z;
            });

            const pad = 12;
            const rangeX = maxX - minX || 1;
            const rangeZ = maxZ - minZ || 1;
            const scale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeZ);
            const offsetX = pad + ((W - pad * 2) - rangeX * scale) / 2;
            const offsetZ = pad + ((H - pad * 2) - rangeZ * scale) / 2;

            let visMin = Infinity, visMax = -Infinity;
            for (let i = 0; i < coords.length; i++) {
                const cx = offsetX + (coords[i].x - minX) * scale;
                const cy = offsetZ + (coords[i].z - minZ) * scale;
                // Same transform drawMap applies: translate(centre+pan), scale(zoom), translate(-centre)
                const sx = mapZoom * (cx - W / 2) + W / 2 + mapPanX;
                const sy = mapZoom * (cy - H / 2) + H / 2 + mapPanY;
                if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
                    const d = cumulativeDists[i] ?? 0;
                    if (d < visMin) visMin = d;
                    if (d > visMax) visMax = d;
                }
            }
            if (!isFinite(visMin)) return; // nothing on-screen

            // Use the exact visible extent so the selection matches the track rendered in the map
            // (no rounding out to a coarse step, which would over-include distance either side).
            let start = Math.max(0, Math.round(visMin));
            let end = Math.min(totalDist, Math.round(visMax));
            if (end <= start) end = Math.min(totalDist, start + 1);

            rangeStart = start;
            rangeEnd = end;

            // Only move the point of interest if it has fallen outside the visible range;
            // otherwise leave it where it is. When moved, recentre it in the range.
            if (poiDist < start || poiDist > end) {
                poiDist = Math.round((start + end) / 2);
            }

            updateSelectionInfo();
            updateChart();
        }

        // Base (identity-transform) coordinate mapping used by the map, matching drawMap.
        function mapMapping(coords, W, H) {
            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            for (const c of coords) {
                if (c.x < minX) minX = c.x;
                if (c.x > maxX) maxX = c.x;
                if (c.z < minZ) minZ = c.z;
                if (c.z > maxZ) maxZ = c.z;
            }
            const pad = 12;
            const rangeX = maxX - minX || 1;
            const rangeZ = maxZ - minZ || 1;
            const scale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeZ);
            return {
                minX, minZ, scale,
                offsetX: pad + ((W - pad * 2) - rangeX * scale) / 2,
                offsetZ: pad + ((H - pad * 2) - rangeZ * scale) / 2,
            };
        }

        // World coord -> on-screen canvas position, applying the current pan/zoom transform.
        function worldToScreen(x, z, m, W, H) {
            const cx = m.offsetX + (x - m.minX) * m.scale;
            const cy = m.offsetZ + (z - m.minZ) * m.scale;
            return { sx: mapZoom * (cx - W / 2) + W / 2 + mapPanX, sy: mapZoom * (cy - H / 2) + H / 2 + mapPanY };
        }

        // Boolean mask (by coord index) of which track points currently fall inside the map
        // viewport — i.e. the portion of the line actually rendered on screen.
        function computeVisibleMask(coords, W, H) {
            const m = mapMapping(coords, W, H);
            const mask = new Uint8Array(coords.length);
            for (let i = 0; i < coords.length; i++) {
                const p = worldToScreen(coords[i].x, coords[i].z, m, W, H);
                if (p.sx >= 0 && p.sx <= W && p.sy >= 0 && p.sy <= H) mask[i] = 1;
            }
            return mask;
        }

        // Index of the track coord whose screen position is closest to (mx, my).
        function nearestFrameToScreen(mx, my, coords, W, H) {
            const m = mapMapping(coords, W, H);
            let best = -1, bestD = Infinity;
            for (let i = 0; i < coords.length; i++) {
                const p = worldToScreen(coords[i].x, coords[i].z, m, W, H);
                const d = (mx - p.sx) ** 2 + (my - p.sy) ** 2;
                if (d < bestD) { bestD = d; best = i; }
            }
            return best;
        }

        // Screen position of the POI marker for the current poiDist.
        function poiScreenPos(coords, W, H) {
            const poiFrame = Math.max(0, Math.min(distToFrame(poiDist), coords.length - 1));
            return worldToScreen(coords[poiFrame].x, coords[poiFrame].z, mapMapping(coords, W, H), W, H);
        }

        function initMapInteraction() {
            const canvas = document.getElementById('map-canvas');
            let isDragging = false;
            let isDraggingPoi = false;
            let dragLastX = 0, dragLastY = 0;
            const POI_HIT_R = 10; // px hit radius for grabbing the POI marker

            function canvasMouse(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    mx: (e.clientX - rect.left) * (canvas.width / rect.width),
                    my: (e.clientY - rect.top) * (canvas.height / rect.height),
                };
            }

            function movePoiTo(mx, my) {
                const coords = mapData[currentLapKey] || [];
                if (coords.length < 1) return;
                const best = nearestFrameToScreen(mx, my, coords, canvas.width, canvas.height);
                if (best < 0) return;
                // Move only the POI; the map stays put (no edge-panning while dragging).
                poiDist = Math.round(cumulativeDists[best] ?? 0);
                updateSelectionInfo();
                updateChart();
                drawMap(currentLapKey);
                scheduleUrlUpdate();
            }

            canvas.addEventListener('mousedown', (e) => {
                const { mx, my } = canvasMouse(e);
                const coords = mapData[currentLapKey] || [];
                // Grab the POI marker if the click landed on it; otherwise pan the map.
                if (coords.length > 1 && totalDist > 0) {
                    const p = poiScreenPos(coords, canvas.width, canvas.height);
                    if (Math.hypot(mx - p.sx, my - p.sy) <= POI_HIT_R) {
                        isDraggingPoi = true;
                        canvas.style.cursor = 'grabbing';
                        e.preventDefault();
                        return;
                    }
                }
                isDragging = true;
                dragLastX = e.clientX;
                dragLastY = e.clientY;
                canvas.classList.add('dragging');
                e.preventDefault();
            });

            // Pointer cursor when hovering the POI marker so it reads as draggable.
            canvas.addEventListener('mousemove', (e) => {
                if (isDragging || isDraggingPoi) return;
                const coords = mapData[currentLapKey] || [];
                let overPoi = false;
                if (coords.length > 1 && totalDist > 0) {
                    const { mx, my } = canvasMouse(e);
                    const p = poiScreenPos(coords, canvas.width, canvas.height);
                    overPoi = Math.hypot(mx - p.sx, my - p.sy) <= POI_HIT_R;
                }
                canvas.style.cursor = overPoi ? 'pointer' : '';
            });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingPoi) {
                    const { mx, my } = canvasMouse(e);
                    movePoiTo(mx, my);
                    return;
                }
                if (!isDragging) return;
                mapPanX += e.clientX - dragLastX;
                mapPanY += e.clientY - dragLastY;
                dragLastX = e.clientX;
                dragLastY = e.clientY;
                mapZoomedToRange = false;
                syncRangeToViewport();
                drawMap(currentLapKey);
                scheduleUrlUpdate();
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingPoi) {
                    isDraggingPoi = false;
                    canvas.style.cursor = '';
                }
                if (isDragging) {
                    isDragging = false;
                    canvas.classList.remove('dragging');
                }
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                // Mouse position relative to canvas element, scaled to canvas resolution
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                const cxCenter = canvas.width / 2;
                const cyCenter = canvas.height / 2;
                const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                // Clamp zoom first, then pan by the factor actually applied. At a zoom limit the
                // effective factor is 1, so the map doesn't drift once zoom stops changing.
                const newZoom = Math.max(1, Math.min(mapZoom * f, 20));
                const ef = newZoom / mapZoom;
                // Zoom around cursor: keep the world point under the cursor fixed
                mapPanX = mx - cxCenter + ef * (mapPanX - mx + cxCenter);
                mapPanY = my - cyCenter + ef * (mapPanY - my + cyCenter);
                mapZoom = newZoom;
                mapZoomedToRange = false;
                syncRangeToViewport();
                drawMap(currentLapKey);
                scheduleUrlUpdate();
            }, { passive: false });

            canvas.addEventListener('dblclick', () => {
                if (mapZoomedToRange) {
                    // Return to full circuit view
                    mapZoom = 1;
                    mapPanX = 0;
                    mapPanY = 0;
                    mapZoomedToRange = false;
                } else {
                    // Zoom to framed selection
                    zoomMapToSelection();
                    mapZoomedToRange = true;
                }
                // Re-derive the visible range from the new viewport so the scatter and
                // speed views follow the map (matches the wheel-zoom handler). This also
                // refreshes the selection info and both charts.
                syncRangeToViewport();
                drawMap(currentLapKey);
                scheduleUrlUpdate();
            });
        }

        function drawMap(lapKey) {
            const coords = mapData[lapKey] || [];
            const canvas = document.getElementById('map-canvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            ctx.clearRect(0, 0, W, H);

            if (coords.length < 2) return;

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            coords.forEach(c => {
                if (c.x < minX) minX = c.x;
                if (c.x > maxX) maxX = c.x;
                if (c.z < minZ) minZ = c.z;
                if (c.z > maxZ) maxZ = c.z;
            });

            const pad = 12;
            const rangeX = maxX - minX || 1;
            const rangeZ = maxZ - minZ || 1;
            const scale = Math.min((W - pad * 2) / rangeX, (H - pad * 2) / rangeZ);
            const offsetX = pad + ((W - pad * 2) - rangeX * scale) / 2;
            const offsetZ = pad + ((H - pad * 2) - rangeZ * scale) / 2;

            // Apply user pan/zoom transform around canvas centre
            ctx.save();
            ctx.translate(W / 2 + mapPanX, H / 2 + mapPanY);
            ctx.scale(mapZoom, mapZoom);
            ctx.translate(-W / 2, -H / 2);

            const toCanvas = (x, z) => ({
                cx: offsetX + (x - minX) * scale,
                cy: offsetZ + (z - minZ) * scale,
            });

            // Scale line widths sub-linearly with zoom so they don't appear too thick when zoomed in.
            // Visual width = base * mapZoom^0.35; achieved by setting lineWidth = base / mapZoom^0.65.
            const lwScale = 1 / Math.pow(mapZoom, 0.65);

            // Full circuit (dimmed)
            ctx.strokeStyle = 'rgba(54, 162, 235, 0.25)';
            ctx.lineWidth = 1.5 * lwScale;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            const first = toCanvas(coords[0].x, coords[0].z);
            ctx.moveTo(first.cx, first.cy);
            for (let idx = 1; idx < coords.length; idx++) {
                const pt = toCanvas(coords[idx].x, coords[idx].z);
                ctx.lineTo(pt.cx, pt.cy);
            }
            ctx.stroke();

            // Highlight the track that is actually inside the viewport, tested per point.
            // Using the on-screen mask (rather than a single contiguous distance range)
            // means a section straddling the start/finish line — one physical piece that
            // maps to non-contiguous frames — is highlighted correctly.
            const visMask = computeVisibleMask(coords, W, H);
            {
                ctx.lineWidth = 2 * lwScale;
                ctx.lineJoin = 'round';

                // When hovering, gray out all segments and then redraw just the hovered point on top.
                // Otherwise draw each segment in its surface colour.
                const isHovering = hoveredFrame !== null && !!visMask[hoveredFrame];

                // Build set of surface types that are currently hidden in the chart legend
                const hiddenSurfaces = new Set();
                if (chart) {
                    chart.data.datasets.forEach((ds, i) => {
                        if (chart.getDatasetMeta(i).hidden) hiddenSurfaces.add(ds.label);
                    });
                }

                // Walk the track drawing each maximal run of consecutive on-screen frames
                // that share a surface as one path. A run ends when the point leaves the
                // viewport or the surface changes; a surface change keeps the boundary
                // point in both segments so the colours stay visually joined.
                let segStart = -1;
                for (let idx = 0; idx <= coords.length; idx++) {
                    const onScreen = idx < coords.length && !!visMask[idx];
                    const surfaceChanged = segStart >= 0 && onScreen && coords[idx].surface !== coords[segStart].surface;

                    if (segStart >= 0 && (!onScreen || surfaceChanged)) {
                        const surface = coords[segStart].surface || 'tarmac';
                        const c = surfaceColors[surface] || surfaceColors.unknown;
                        const dimmed = isHovering || hiddenSurfaces.has(surface);
                        ctx.strokeStyle = dimmed ? c.border.replace(/,([\s\d.]+)\)$/, ', 0.15)') : c.border;
                        ctx.beginPath();
                        const segFirst = toCanvas(coords[segStart].x, coords[segStart].z);
                        ctx.moveTo(segFirst.cx, segFirst.cy);
                        const segEnd = surfaceChanged ? idx : idx - 1; // include boundary on surface change
                        for (let jdx = segStart + 1; jdx <= segEnd; jdx++) {
                            const pt = toCanvas(coords[jdx].x, coords[jdx].z);
                            ctx.lineTo(pt.cx, pt.cy);
                        }
                        ctx.stroke();
                        segStart = surfaceChanged ? idx : -1;
                    } else if (onScreen && segStart < 0) {
                        segStart = idx;
                    }
                }

                // Redraw the hovered point's segment at full colour on top of the faded track
                if (isHovering) {
                    const surface = coords[hoveredFrame].surface || 'tarmac';
                    const c = surfaceColors[surface] || surfaceColors.unknown;
                    ctx.strokeStyle = c.border;
                    ctx.beginPath();
                    const hc = toCanvas(coords[hoveredFrame].x, coords[hoveredFrame].z);
                    // Connect to the previous frame so the segment has visible length
                    const prev = hoveredFrame > 0 ? toCanvas(coords[hoveredFrame - 1].x, coords[hoveredFrame - 1].z) : hc;
                    ctx.moveTo(prev.cx, prev.cy);
                    ctx.lineTo(hc.cx, hc.cy);
                    ctx.stroke();
                    // Small filled dot — just large enough to stand out from the line
                    ctx.fillStyle = c.border;
                    ctx.beginPath();
                    ctx.arc(hc.cx, hc.cy, ctx.lineWidth * 0.75, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const startPt = toCanvas(coords[0].x, coords[0].z);
            const nextPt = toCanvas(coords[1].x, coords[1].z);
            const dx = nextPt.cx - startPt.cx;
            const dy = nextPt.cy - startPt.cy;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const perpX = -dy / len;
            const perpY = dx / len;
            const halfLen = 7 * lwScale;
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 2 * lwScale;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startPt.cx - perpX * halfLen, startPt.cy - perpY * halfLen);
            ctx.lineTo(startPt.cx + perpX * halfLen, startPt.cy + perpY * halfLen);
            ctx.stroke();

            // Point-of-interest marker: filled with its surface colour, white ring (matches the
            // emphasised scatter points).
            if (totalDist > 0) {
                const poiFrame = Math.max(0, Math.min(distToFrame(poiDist), coords.length - 1));
                const pp = toCanvas(coords[poiFrame].x, coords[poiFrame].z);
                const c = surfaceColors[coords[poiFrame].surface] || surfaceColors.unknown;
                ctx.beginPath();
                ctx.arc(pp.cx, pp.cy, 5 * lwScale, 0, Math.PI * 2);
                ctx.fillStyle = c.border;
                ctx.fill();
                ctx.lineWidth = 1.5 * lwScale;
                ctx.strokeStyle = HIGHLIGHT_RING;
                ctx.stroke();
            }

            ctx.restore();
        }

        function createChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: [] },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1.4,
                    onHover: (_event, elements) => {
                        const frame = elements.length > 0
                            ? (chart.data.datasets[elements[0].datasetIndex].data[elements[0].index].frame ?? null)
                            : null;
                        // Hovering the scatter also marks the map track point and speed-chart point.
                        setHovered(frame ?? null, 'scatter');
                    },
                    onClick: (_event, elements) => {
                        // Clicking a scatter point moves the POI to that point's lap position.
                        if (elements.length === 0) return;
                        const pt = chart.data.datasets[elements[0].datasetIndex].data[elements[0].index];
                        if (!pt || pt.frame == null) return;
                        poiDist = Math.round(cumulativeDists[pt.frame] ?? pt.dist ?? 0);
                        updateSelectionInfo();
                        updateChart();
                        drawMap(currentLapKey);
                        scheduleUrlUpdate();
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#ccc', usePointStyle: true, pointStyle: 'circle',
                                filter: (item) => item.text !== HIGHLIGHT_LABEL
                            },
                            onClick(e, legendItem, legend) {
                                // Run the default toggle
                                Chart.defaults.plugins.legend.onClick.call(this, e, legendItem, legend);
                                // Drop highlight points belonging to any now-hidden surface
                                syncHighlight();
                                chart.update('none');
                                // Recompute bounds from visible datasets only
                                const visibleDatasets = chart.data.datasets.filter((_, i) => chart.isDatasetVisible(i));
                                const niceBounds = computeNiceBounds(visibleDatasets);
                                targetScales = { ...niceBounds };
                                startScaleChase();
                                // Reflect visibility on the circuit map
                                drawMap(currentLapKey);
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const dist = ctx.raw.dist ?? 0;
                                    const distStr = dist >= 1000
                                        ? `${(dist / 1000).toFixed(2)} km`
                                        : `${dist.toFixed(0)} m`;
                                    return `Jerk: ${ctx.parsed.x.toFixed(1)}, Snap: ${ctx.parsed.y.toFixed(1)}, Distance: ${distStr}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Jerk (m/s³)', color: '#aaa', font: { size: 14 } },
                            ticks: {
                                color: '#888',
                                callback: function (value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: 'rgba(255,255,255,0.06)' }
                        },
                        y: {
                            title: { display: true, text: 'Snap (m/s⁴)', color: '#aaa', font: { size: 14 } },
                            ticks: {
                                color: '#888',
                                callback: function (value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: 'rgba(255,255,255,0.06)' }
                        }
                    }
                }
            });
        }

        // Draws the POI as a dashed vertical line on the speed chart, with a dot and label
        // showing the speed at that point. Colour matches the map's POI marker (surface colour).
        // Shared hover state across the scatter chart, speed chart and map. Highlights the same
        // frame in all three: map track point, scatter point, and a speed-chart marker.
        // `source` is the chart the hover came from, so we don't fight its own native highlight.
        function setHovered(frame, source) {
            if (frame === hoveredFrame) return;
            hoveredFrame = frame;
            drawMap(currentLapKey);
            if (source !== 'scatter') highlightScatterFrame(frame); // scatter highlights itself natively
            if (speedChart) speedChart.render();
        }

        // Programmatically put a scatter point into its hover state (and tooltip) by frame.
        function highlightScatterFrame(frame) {
            if (!chart) return;
            let el = null;
            if (frame != null) {
                for (let di = 0; di < chart.data.datasets.length && !el; di++) {
                    const idx = chart.data.datasets[di].data.findIndex(p => p.frame === frame);
                    if (idx >= 0) el = { datasetIndex: di, index: idx };
                }
            }
            chart.setActiveElements(el ? [el] : []);
            if (chart.tooltip) {
                const meta = el && chart.getDatasetMeta(el.datasetIndex).data[el.index];
                chart.tooltip.setActiveElements(el ? [el] : [], meta ? { x: meta.x, y: meta.y } : { x: 0, y: 0 });
            }
            chart.render();
        }

        // Vertical marker + dot + speed label at the hovered frame (distinct from the POI marker).
        const hoverSpeedMarker = {
            id: 'hoverSpeedMarker',
            afterDatasetsDraw(chart) {
                if (hoveredFrame == null || speeds.length === 0) return;
                const dist = cumulativeDists[hoveredFrame];
                if (dist == null) return;
                const dx = speedDisplayX(dist);
                const xScale = chart.scales.x, yScale = chart.scales.y;
                if (dx < xScale.min || dx > xScale.max) return;

                const x = xScale.getPixelForValue(dx);
                const spd = speeds[hoveredFrame] ?? 0;
                const y = yScale.getPixelForValue(spd);
                const { top, bottom, right } = chart.chartArea;
                const ctx = chart.ctx;

                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, top);
                ctx.lineTo(x, bottom);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                const label = `${Math.round(spd)} km/h`;
                ctx.font = '11px system-ui, sans-serif';
                ctx.textBaseline = 'bottom';
                const tw = ctx.measureText(label).width;
                const tx = (x + 6 + tw > right) ? x - 6 - tw : x + 6;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, tx, Math.max(top + 12, y - 6));
                ctx.restore();
            },
        };

        const poiSpeedMarker = {
            id: 'poiSpeedMarker',
            afterDatasetsDraw(chart) {
                if (totalDist <= 0 || speeds.length === 0) return;
                const xScale = chart.scales.x, yScale = chart.scales.y;
                const dx = speedDisplayX(poiDist);
                if (dx < xScale.min || dx > xScale.max) return; // POI not in view

                const x = xScale.getPixelForValue(dx);
                const poiFrame = Math.max(0, Math.min(distToFrame(poiDist), speeds.length - 1));
                const spd = speeds[poiFrame] ?? 0;
                const y = yScale.getPixelForValue(spd);
                const coords = mapData[currentLapKey] || [];
                const c = surfaceColors[coords[poiFrame] && coords[poiFrame].surface] || surfaceColors.unknown;
                const { top, bottom, right } = chart.chartArea;
                const ctx = chart.ctx;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, top);
                ctx.lineTo(x, bottom);
                ctx.strokeStyle = c.border;
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 3]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Dot at the speed value, matching the map marker (surface fill, white ring)
                ctx.beginPath();
                ctx.arc(x, y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = c.border;
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = HIGHLIGHT_RING;
                ctx.stroke();

                // Speed label, flipped to the left if it would overflow the right edge
                const label = `${Math.round(spd)} km/h`;
                ctx.font = '11px system-ui, sans-serif';
                ctx.textBaseline = 'top';
                const tw = ctx.measureText(label).width;
                const tx = (x + 6 + tw > right) ? x - 6 - tw : x + 6;
                ctx.fillStyle = '#e0e0e0';
                ctx.fillText(label, tx, top + 2);
                ctx.restore();
            },
        };

        function createSpeedChart() {
            const ctx = document.getElementById('speed-chart').getContext('2d');
            speedChart = new Chart(ctx, {
                type: 'line',
                data: { datasets: [] },
                plugins: [poiSpeedMarker, hoverSpeedMarker],
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false,
                    spanGaps: false, // null y-values break the line between disconnected sections
                    interaction: { mode: 'nearest', intersect: false, axis: 'x' },
                    onHover: (_event, elements) => {
                        let frame = null;
                        if (elements.length > 0) {
                            const d = speedChart.data.datasets[elements[0].datasetIndex].data[elements[0].index];
                            if (d && d.frame != null) frame = d.frame;
                        }
                        setHovered(frame, 'speed');
                    },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: 'Distance', color: '#aaa', font: { size: 12 } },
                            ticks: {
                                color: '#888',
                                callback: (v) => v >= 1000 ? (v / 1000).toFixed(1) + ' km' : Math.round(v) + ' m',
                            },
                            grid: { color: 'rgba(255,255,255,0.06)' },
                        },
                        y: {
                            title: { display: true, text: 'Speed (km/h)', color: '#aaa', font: { size: 12 } },
                            ticks: { color: '#888' },
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            beginAtZero: true,
                        },
                    },
                },
            });
        }

        // Maps a true lap distance to its plotted x on the speed chart. When the visible
        // section wraps the start/finish line, the trailing (high-distance) part is shifted
        // back by one lap so it sits just before the leading part. Identity when no wrap.
        function speedDisplayX(dist) {
            if (speedWrapThreshold != null && dist >= speedWrapThreshold) return dist - totalDist;
            return dist;
        }

        // Plot speed vs distance for the visible track only. Visible frames form runs of
        // consecutive indices; a run leaving and re-entering the viewport is drawn as
        // separate segments (null break). A section that straddles the start/finish line
        // shows up as a run ending at the last frame plus a run starting at the first — one
        // physical piece — so it is unwrapped and drawn as a single continuous trace.
        function updateSpeedChart(coords, mask) {
            if (!speedChart) return;
            const n = coords.length;

            // Maximal runs of consecutive on-screen frames.
            const runs = [];
            let s = -1;
            for (let i = 0; i < n; i++) {
                const on = !mask || !!mask[i];
                if (on && s < 0) s = i;
                if (!on && s >= 0) { runs.push([s, i - 1]); s = -1; }
            }
            if (s >= 0) runs.push([s, n - 1]);

            // Detect a start/finish straddle: a run touching the first frame and one
            // touching the last frame. The trailing run is unwrapped (shifted -totalDist)
            // and plotted first, ahead of the leading run.
            const wrap = runs.length >= 2 && runs[0][0] === 0 &&
                runs[runs.length - 1][1] === n - 1 && totalDist > 0;
            speedWrapThreshold = wrap ? cumulativeDists[runs[runs.length - 1][0]] : null;
            const order = wrap ? [runs[runs.length - 1], ...runs.slice(0, runs.length - 1)] : runs;

            const pts = [];
            let firstX = null, lastX = null;
            for (let r = 0; r < order.length; r++) {
                const [a, b] = order[r];
                if (r > 0) {
                    // Break the line unless this run is physically adjacent to the previous
                    // one in cyclic frame order (the unwrap join is; a real gap is not).
                    const prevEnd = order[r - 1][1];
                    const adjacent = (prevEnd + 1) % n === a;
                    if (!adjacent) {
                        pts.push({ x: (lastX + speedDisplayX(cumulativeDists[a])) / 2, y: null });
                    }
                }
                for (let i = a; i <= b; i++) {
                    const x = speedDisplayX(cumulativeDists[i] ?? 0);
                    pts.push({ x, y: speeds[i] ?? 0, t: coords[i].throttle ?? 0, b: coords[i].brake ?? 0, frame: i });
                    if (firstX === null) firstX = x;
                    lastX = x;
                }
            }
            // Bind the x-axis to the visible extent so the trace fills the axis and the x zoom
            // tracks the visible range, rather than the chart re-fitting/snapping to the data.
            speedChart.options.scales.x.min = firstX;
            speedChart.options.scales.x.max = lastX;
            speedChart.data.datasets = [{
                data: pts,
                borderColor: '#888',
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.15,
                // Colour each segment by driver input: green on throttle, red on brake.
                segment: {
                    borderColor: (ctx) => {
                        const d = ctx.chart.data.datasets[ctx.datasetIndex].data[ctx.p1DataIndex];
                        return d && d.y != null ? throttleBrakeColor(d.t, d.b) : undefined;
                    },
                },
            }];
            speedChart.update('none');
        }

        // Segment colour from throttle/brake percentages (0-100): green for throttle, red for
        // brake (brighter with more input), neutral grey when coasting.
        function throttleBrakeColor(t, b) {
            t = t || 0; b = b || 0;
            if (t < 3 && b < 3) return '#8a8a8a';
            if (b >= t) {
                const k = Math.min(1, b / 100);
                const c = Math.round(70 * (1 - k));
                return `rgb(${Math.round(150 + 105 * k)}, ${c}, ${c})`;
            }
            const k = Math.min(1, t / 100);
            const c = Math.round(70 * (1 - k));
            return `rgb(${c}, ${Math.round(150 + 105 * k)}, ${c})`;
        }

        function lerp(a, b, t) { return a + (b - a) * t; }

        function scalesCloseEnough(a, b) {
            return Math.abs(a.xMin - b.xMin) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.xMax - b.xMax) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.yMin - b.yMin) < SCALE_SNAP_THRESHOLD &&
                Math.abs(a.yMax - b.yMax) < SCALE_SNAP_THRESHOLD;
        }

        function startScaleChase() {
            if (scaleChaseRaf) return; // already running
            function step() {
                if (!displayedScales || !targetScales) {
                    scaleChaseRaf = null;
                    return;
                }
                if (scalesCloseEnough(displayedScales, targetScales)) {
                    // Arrived — snap to exact target values
                    displayedScales = { ...targetScales };
                    applyScalesToChart(displayedScales);
                    chart.update('none');
                    scaleChaseRaf = null;
                    return;
                }
                displayedScales.xMin = lerp(displayedScales.xMin, targetScales.xMin, SCALE_LERP);
                displayedScales.xMax = lerp(displayedScales.xMax, targetScales.xMax, SCALE_LERP);
                displayedScales.yMin = lerp(displayedScales.yMin, targetScales.yMin, SCALE_LERP);
                displayedScales.yMax = lerp(displayedScales.yMax, targetScales.yMax, SCALE_LERP);

                applyScalesToChart(displayedScales);
                chart.update('none');
                scaleChaseRaf = requestAnimationFrame(step);
            }
            scaleChaseRaf = requestAnimationFrame(step);
        }

        // Apply displayedScales to chart, rounding min/max to niceAxisStep precision to prevent
        // label jitter from floating-point lerp values.
        function applyScalesToChart(scales) {
            const xStep = niceAxisStep(scales.xMax - scales.xMin || 1);
            const yStep = niceAxisStep(scales.yMax - scales.yMin || 1);
            chart.options.scales.x.min = Math.round(scales.xMin / xStep) * xStep;
            chart.options.scales.x.max = Math.round(scales.xMax / xStep) * xStep;
            chart.options.scales.y.min = Math.round(scales.yMin / yStep) * yStep;
            chart.options.scales.y.max = Math.round(scales.yMax / yStep) * yStep;
        }

        // Round to a "nice" number: 1, 2, 5, 10, 20, 50, 100, ...
        function niceStep(range) {
            const rough = Math.pow(10, Math.floor(Math.log10(range)));
            const frac = range / rough;
            if (frac <= 1.5) return rough;
            if (frac <= 3.5) return rough * 2;
            if (frac <= 7.5) return rough * 5;
            return rough * 10;
        }

        // A finer step for axis bounds: targets ~12 tick intervals so min/max
        // hug the data rather than overshoot by a full order of magnitude.
        function niceAxisStep(range) {
            return niceStep(range / 12);
        }

        function niceMinMax(dataMin, dataMax) {
            const range = dataMax - dataMin || 1;
            const step = niceAxisStep(range);
            return {
                min: Math.floor(dataMin / step) * step,
                max: Math.ceil(dataMax / step) * step,
            };
        }

        // Compute nice bounds directly from data points — no Chart.js render needed
        function computeNiceBounds(datasets) {
            let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
            datasets.forEach(ds => {
                ds.data.forEach(pt => {
                    if (pt.x < xMin) xMin = pt.x;
                    if (pt.x > xMax) xMax = pt.x;
                    if (pt.y < yMin) yMin = pt.y;
                    if (pt.y > yMax) yMax = pt.y;
                });
            });
            if (!isFinite(xMin)) { xMin = -1; xMax = 1; yMin = -1; yMax = 1; }
            const xNice = niceMinMax(xMin, xMax);
            const yNice = niceMinMax(yMin, yMax);
            return { xMin: xNice.min, xMax: xNice.max, yMin: yNice.min, yMax: yNice.max };
        }

        // Rebuild the "point of interest" overlay dataset from highlightSource, excluding any
        // surfaces currently hidden via the legend. Given a low `order` so it draws on top
        // (Chart.js paints datasets in reverse order). Each point keeps its surface colour with
        // a white ring. Call after any change to selection or surface visibility.
        function syncHighlight() {
            if (!chart) return;

            chart.data.datasets = chart.data.datasets.filter(ds => ds.label !== HIGHLIGHT_LABEL);

            const hidden = new Set();
            chart.data.datasets.forEach((ds, i) => {
                if (chart.getDatasetMeta(i).hidden) hidden.add(ds.label);
            });

            const pts = highlightSource.filter(p => !hidden.has(p.surface));
            if (pts.length === 0) return;

            chart.data.datasets.push({
                label: HIGHLIGHT_LABEL,
                data: pts,
                backgroundColor: pts.map(p => (surfaceColors[p.surface] || surfaceColors.unknown).border),
                borderColor: HIGHLIGHT_RING,
                borderWidth: 1.5,
                pointRadius: 3.5,
                pointHoverRadius: 6,
                order: -1,
            });
        }

        function updateChart() {
            const coords = mapData[currentLapKey] || [];
            const grouped = {};

            // Plot the points whose track position is actually rendered in the map viewport.
            // Falls back to all points when there is no map geometry to test against.
            const canvas = document.getElementById('map-canvas');
            const mask = coords.length >= 2 ? computeVisibleMask(coords, canvas.width, canvas.height) : null;
            const shownPoints = mask ? allData.filter(d => mask[d.frame]) : allData.slice();
            const shown = shownPoints.length;

            // Emphasise the `highlightCount` plotted points nearest the point of interest.
            const poiFrame = distToFrame(poiDist);
            const selected = new Set(
                [...shownPoints]
                    .sort((a, b) => Math.abs(a.frame - poiFrame) - Math.abs(b.frame - poiFrame))
                    .slice(0, highlightCount)
            );

            highlightSource = [...selected].map(d => ({
                x: jerkOf(d), y: snapOf(d), dist: cumulativeDists[d.frame] ?? 0, frame: d.frame, surface: d.surface,
            }));
            shownPoints.forEach(d => {
                if (!grouped[d.surface]) grouped[d.surface] = [];
                grouped[d.surface].push({ x: jerkOf(d), y: snapOf(d), dist: cumulativeDists[d.frame] ?? 0, frame: d.frame });
            });

            const existing = new Map(chart.data.datasets.map(ds => [ds.label, ds]));
            const newDatasets = [];

            chart.data.datasets = Object.entries(grouped).map(([surface, data]) => {
                const c = surfaceColors[surface] || surfaceColors.unknown;
                if (existing.has(surface)) {
                    const ds = existing.get(surface);
                    ds.data = data;
                    ds.backgroundColor = c.bg;
                    ds.borderColor = c.border;
                    return ds;
                }
                const ds = {
                    label: surface,
                    data,
                    backgroundColor: alphaScale(c.bg, 0),
                    borderColor: alphaScale(c.border, 0),
                    _targetBg: c.bg,
                    _targetBorder: c.border,
                    borderWidth: 1,
                    pointRadius: 2.5,
                    pointHoverRadius: 5,
                };
                newDatasets.push(ds);
                return ds;
            });

            // Emphasise the POI-nearest points on top, honouring surface-legend visibility.
            syncHighlight();

            // Compute nice target bounds directly from data — no extra renders
            const niceBounds = computeNiceBounds(chart.data.datasets);

            if (!displayedScales) {
                // First render — snap immediately, no animation
                displayedScales = { ...niceBounds };
                targetScales = { ...niceBounds };
            } else {
                // Set chase target; the animation loop will smoothly lerp toward it
                targetScales = { ...niceBounds };
                startScaleChase();
            }

            // Apply current displayed scales and render once
            applyScalesToChart(displayedScales);
            chart.update('none');

            if (fadeRaf) cancelAnimationFrame(fadeRaf);
            fadeStartTime = null;

            if (newDatasets.length > 0) {
                function fadeStep(ts) {
                    if (!fadeStartTime) fadeStartTime = ts;
                    const t = Math.min((ts - fadeStartTime) / FADE_DURATION, 1);
                    newDatasets.forEach(ds => {
                        ds.backgroundColor = alphaScale(ds._targetBg, t);
                        ds.borderColor = alphaScale(ds._targetBorder, t);
                    });
                    chart.update('none');
                    fadeRaf = t < 1 ? requestAnimationFrame(fadeStep) : null;
                }
                fadeRaf = requestAnimationFrame(fadeStep);
            }

            document.getElementById('sel-points').textContent = `${shown} / ${allData.length}`;

            updateSpeedChart(coords, mask);
        }

        init();
    </script>
</body>
